cies → New → Locations → add Microsoft 365 Copilot → Rules: use label-based conditions (SIT-based prompt DLP not confirmed in GCC High) → set enforcement action → enable in test mode first → document what was tested and observed before switching to enforcement.",gcch:"Test DLP enforcement explicitly in the GCC High tenant. Known enforcement gaps exist. Document observed behavior and report findings to the security officer."},{id:"pur-6",title:"Sensitivity Labels  -  SharePoint Sites and Teams",pri:"CRITICAL",st:"not-started",what:"Apply sensitivity labels to SharePoint sites, Microsoft 365 Groups, and Teams. Currently zero site-level labels in this tenant. Without site labels, DLP cannot enforce label-based conditions and Copilot cannot inherit content classifications. Every site going onto the Restricted SharePoint Search allowed list must be labeled before being added.",impact:"Site sensitivity labels are the foundation for everything downstream: DLP enforcement, label inheritance, governance reporting, and Copilot classification awareness. Zero labels means zero DLP label coverage for Copilot.",how:"compliance.microsoft.us → Information Protection → enable sensitivity labels for SharePoint sites and groups → create label hierarchy (Public, Internal, Confidential minimum) → apply to highest-risk and pilot sites first → configure a default label policy for new sites. Enable Teams labels as well.",gcch:"Start with the 5-10 sites going on the Restricted SharePoint Search pilot allowed list. Label before adding to the list."},{id:"pur-8",title:"Default Label Policy  -  Baseline Label for Unlabeled Content",pri:"HIGH",st:"not-started",what:"Configure a default label policy that applies a designated baseline label to all content that has not been explicitly labeled. This makes unlabeled content visible to DLP policy enforcement, including when that content is attached to or referenced in a Copilot prompt.",impact:"With a baseline default label in place, DLP policies can treat unlabeled content as a distinct class  -  restricting unlabeled files referenced in Copilot interactions. Without this, unlabeled content is invisible to label-based DLP conditions.",how:"compliance.microsoft.us → Information Protection → Label policies → create or update the default label policy → assign a baseline label (e.g., 'Unclassified  -  Pending Review') as the default for SharePoint, OneDrive, and Exchange → write a DLP rule targeting this label in Copilot interactions → set enforcement to audit first, then warn or block after validation.",gcch:"Operationally pragmatic for environments where full content classification is not yet feasible. Default label plus DLP provides governance coverage over unlabeled content while classification is phased in."},{id:"pur-10",title:"Legacy Document Protection  -  Inventory and Migration",pri:"HIGH",st:"not-started",what:"Approximately 430 documents are protected with legacy Information Rights Management encryption. These documents are invisible to Copilot  -  it cannot read or surface them. Users asking Copilot about content in these documents will get nothing back.",impact:"Legacy document protection is a silent content gap that undermines user confidence in Copilot. Until these documents are migrated to Purview sensitivity labels, they remain inaccessible to AI grounding.",how:"Use Purview Content Explorer and PowerShell to inventory legacy protected documents → prioritize by usage frequency and mission relevance → migrate to Purview sensitivity labels → validate Copilot can access post-migration.",gcch:"Legacy Information Rights Management encryption is not recognized by Copilot. Only Purview sensitivity label encryption is supported for Copilot grounding."},{id:"pur-12",title:"eDiscovery and Content Search Readiness",pri:"HIGH",st:"not-started",what:"Confirm Copilot interaction data is discoverable via Purview audit and eDiscovery. Use the CopilotInteraction activity type as the filter. Document the results  -  these are your authorization evidence, not assumptions about storage services.",impact:"Required for compliance and forensic readiness. Observable eDiscovery results are the defensible evidence path for authorization documentation.",how:"compliance.microsoft.us → eDiscovery → create a test case → run a Content Search filtered by CopilotInteraction activity from a known pilot user → confirm results appear correctly → document findings and file to authorization evidence folder.",gcch:"Cite observable controls as authorization evidence: audit log events, eDiscovery results, retention policy configuration. Do not assert storage implementation details."},{id:"pur-14",title:"Communication Compliance  -  Copilot Coverage",pri:"HIGH",st:"in-progress",what:"Verify that Communication Compliance policies explicitly cover Copilot interactions. Use the 'Detect Microsoft Copilot interactions' policy template. Evaluate for AI-generated content violations, policy language, and code-of-conduct concerns.",impact:"Without explicit Copilot coverage in Communication Compliance, policy-violating interactions may go undetected.",how:"compliance.microsoft.us → Communication Compliance → review existing policies → confirm Copilot interactions are in scope → apply the Detect Microsoft Copilot interactions template → tune thresholds.",gcch:"Communication Compliance is available in GCC High with most core features. Verify the Copilot-specific template is available in your tenant."}]},{id:"monitoring",label:"Monitoring & Signals",sub:"Ongoing Oversight",bg:"#92400E",acc:"#FBBF24",items:[{id:"mon-1",title:"Data Security Posture Management for AI  -  Setup and Risk Assessments",pri:"HIGH",st:"not-started",what:"Two steps: (1) Complete the DSPM for AI onboarding checklist in Purview: confirm Audit is on, install the Purview compliance browser extension, onboard devices via Defender for Endpoint, apply the one-click recommended policies. (2) Configure data risk assessments for pilot SharePoint sites to identify oversharing exposure specific to Copilot.",impact:"DSPM for AI provides the AI-specific security posture dashboard with automatic recommendations. The data risk assessments score each site's Copilot exposure risk. Both require E5/G5 licensing.",how:"compliance.microsoft.us → DSPM for AI → Get Started checklist → apply one-click policies → Activity Explorer for AI signals → Data risk assessments → configure pilot sites (up to 10 sites, 200,000 items per location). Note: OneDrive item-level scanning is NOT currently supported  -  use Data Access Governance reports for OneDrive.",gcch:"Available in GCC High with one limitation: Browse to URL policies cannot be created  -  only Microsoft-supported AI sites are surfaced. Validate E5/G5 licensing before configuration."},{id:"mon-3",title:"Insider Risk Management  -  Risky AI Usage Policy",pri:"HIGH",st:"not-started",what:"Configure an Insider Risk Management policy using the risky AI usage template to detect potentially risky Copilot behavior patterns across the organization.",impact:"Behavioral security monitoring for Copilot. Catches abuse and anomalous usage patterns that DLP policies and audit log reviews alone miss.",how:"compliance.microsoft.us → Insider Risk Management → Policies → New → Risky AI usage template → tune detection thresholds against pilot cohort activity before broad enforcement.",gcch:"Core Insider Risk Management features are generally available in GCC High. Some advanced policy templates may be in Preview  -  verify the risky AI usage template is available in your tenant against the GCC High Purview feature matrix."},{id:"mon-4",title:"Defender for Cloud Apps  -  Shadow AI Discovery",pri:"MEDIUM",st:"not-started",what:"Review Microsoft Defender for Cloud Apps Cloud Discovery findings to identify non-Microsoft generative AI services in active use across the organization. Apply ongoing monitoring policies for sanctioned, tolerated, and blocked AI tools. This is the monitoring complement to the Shadow AI Controls setup task in the Unlicensed Chat phase.",impact:"Provides ongoing visibility into shadow AI usage after the initial block policies are in place. New services emerge continuously.",how:"Defender for Cloud Apps → Cloud Discovery → review AI app category findings monthly → update App Control policies as new tools emerge → coordinate with security operations team for enforcement actions.",gcch:"Available in GCC High. Coordinate with the security operations team. Shadow AI findings should feed into the risk register and be reviewed quarterly."},{id:"mon-6",title:"Quarterly Audit Log Review",pri:"ONGOING",st:"not-started",what:"Quarterly review of Copilot audit logs for anomalous usage patterns, unexpected data access, and potential policy violations. Required for continuous authorization monitoring.",impact:"Required evidence for authorization continuous monitoring. Demonstrates active oversight of Copilot behavior in the tenant.",how:"compliance.microsoft.us → Audit → CopilotInteraction activity for the previous quarter → review for anomalous patterns → document findings → file to authorization evidence folder. Export the results for the security officer's quarterly review.",gcch:"File quarterly review results to the authorization evidence folder. Maintain a log of findings and remediation actions taken."}]},{id:"entra",label:"Entra ID Governance",sub:"Access Reviews & Lifecycle",bg:"#1E3A5F",acc:"#38BDF8",items:[{id:"ent-1",title:"Configure Quarterly Access Reviews  -  Guests, Privileged Roles, and Groups",pri:"HIGH",st:"not-started",what:"Three access reviews configured in the same admin session: (1) B2B guest users with access to Microsoft 365 Groups, Teams, or SharePoint sites in pilot scope  -  auto-revoke on no response. (2) All Entra roles with material privilege: Global Admin, SharePoint Admin, Exchange Admin, Compliance Admin, Security Admin  -  pair with Privileged Identity Management just-in-time activation. (3) Microsoft 365 Groups and Teams that own SharePoint sites in pilot scope  -  site owners as reviewers.",impact:"Unreviewed guest access and stale group memberships are two of the most common sources of Copilot oversharing risk. Privileged accounts with Copilot access can surface significantly more data than standard users.",how:"Entra Identity Governance → Access Reviews → Create → configure one review for each category with a quarterly cadence. For guest reviews: auto-revoke non-responders. For privileged role reviews: pair with Privileged Identity Management just-in-time activation. For group reviews: assign site owners as reviewers.",gcch:"GCC High customers often operate at Existing guests only sharing level  -  verify alignment between SharePoint sharing settings and Entra B2B configuration. Privileged Identity Management available in GCC High  -  verify advanced features against service description."},{id:"ent-4",title:"Access Reviews  -  Applications and Service Principals",pri:"HIGH",st:"not-started",what:"Identify applications and service principals with access to Microsoft Graph or SharePoint that could surface content in Copilot agents or connectors. Review consented permissions and remove stale or overpermissioned service principals.",impact:"Critical as Copilot agents and connectors are introduced. Each registered application with Graph access is a potential data exposure path for Copilot behavior.",how:"Entra → App registrations + Enterprise applications → review all apps with SharePoint or Graph permissions → run access reviews on application assignments → identify and remove stale service principals → document current application permission state.",gcch:"Critical before onboarding any Copilot agents. Each agent registration creates a new service principal that must be included in future access reviews."},{id:"ent-5",title:"Lifecycle Workflows  -  Employee Onboarding, Transfer, and Offboarding",pri:"HIGH",st:"not-started",what:"Configure or validate Entra ID Governance Lifecycle Workflows for three employee events: joiners (new hires receive correct group memberships and licenses), movers (internal transfers get updated access), and leavers (departing employees lose Copilot license and group memberships within the target SLA).",impact:"A departing employee who retains a Copilot license retains Microsoft Graph access to tenant data until manually revoked. In a licensed Copilot deployment, this is a data exposure risk that grows with organizational turnover.",how:"Entra Identity Governance → Lifecycle workflows → configure joiner, mover, and leaver workflows → integrate with HR system signals where available → document the deprovisioning evidence loop.",gcch:"Document the deprovisioning timeline and process for authorization purposes. Federal customers should target same-day revocation for leavers."},{id:"ent-6",title:"Conditional Access  -  Validate Copilot Sign-Ins",pri:"HIGH",st:"not-started",what:"Use the Conditional Access What If tool to confirm that Copilot-related sign-ins trigger the correct policy evaluations: device compliance enforcement, multi-factor authentication, sign-in risk assessment.",impact:"Copilot must not create an expanded data access and discovery surface by bypassing existing Conditional Access controls.",how:"entra.microsoft.us → Conditional Access → What If tool → test with a representative pilot user identity → verify the correct CA policy evaluates → test from a non-compliant device (should be blocked) → document results.",gcch:"Test Conditional Access changes in report-only mode before enforcement to avoid breaking the pilot cohort."}]},{id:"adminconfig",label:"Admin Config Settings",sub:"Key Control Decisions",bg:"#0F4C81",acc:"#7DD3FC",items:[{id:"cfg-1",title:"Copilot Chat Pinning  -  Do Not Pin",pri:"CRITICAL",st:"complete",what:"Controls whether Copilot Chat auto-pins in the navigation of Word, Excel, PowerPoint, and OneNote.",impact:"Suppresses the entry point but does not block access. Conditional Access and Integrated Apps are the actual security gates.",how:"COMPLETED  -  admin.microsoft365.us → Copilot → Settings → Pin Copilot Chat → Do not pin → Do not ask users.",gcch:"In GCC High, Copilot Chat is desktop-only for unlicensed users  -  the web app surface is not yet available."},{id:"cfg-2",title:"Web Grounding (Cloud Policy)  -  Confirmed OFF and Documented",pri:"CRITICAL",st:"complete",what:"Web grounding is OFF by default in GCC High. This setting must be explicitly confirmed, screenshot, and filed as authorization evidence  -  default state does not substitute for documented evidence. When enabled, web grounding may send query content or metadata to commercial Bing infrastructure outside the GCC High boundary.",impact:"This documented setting is a core authorization control assertion. Any future change to how this is controlled  -  including potential evolution toward automatic grounding  -  must trigger a review of authorization assumptions.",how:"admin.microsoft365.us → Copilot → Settings → web grounding / web search control → confirm OFF → screenshot showing setting, admin account, and date → file to authorization evidence folder.",gcch:"Do not enable without written security team approval and formal risk acceptance. Per-group scoping via Cloud Policy may be possible  -  validate in tenant before communicating to the security officer as an option."},{id:"cfg-4",title:"Agents Governance Policy  -  Publish Before Enabling",pri:"CRITICAL",st:"not-started",what:"Before the Agents admin setting is enabled for any user, publish a formal agent governance policy defining who can create agents, what data sources they are permitted to access, the review and approval process before an agent goes to production, and the monitoring requirements.",impact:"Without governance, any licensed user can create a declarative agent that accesses tenant data with no oversight. In GCC High, no group-level creation controls currently exist  -  policy is the only mechanism.",how:"Draft agent governance policy → review with security and compliance teams → publish to SharePoint → confirm all licensed users have been notified. Policy must cover: creator authorization, permitted data sources, approval workflow, monitoring requirements, and decommissioning process. Then: admin.microsoft365.us → Settings → Agents → configure per policy.",gcch:"Only declarative agents via M365 Agents Toolkit (pro-code path) are currently confirmed in GCC High. Agent Builder and low-code Copilot Studio authoring not yet confirmed. Do not communicate those capabilities as available until validated in your tenant."},{id:"cfg-10",title:"Graph Connectors  -  Governance and Enablement Policy",pri:"HIGH",st:"not-started",what:"Microsoft Graph connectors enable ingestion of line-of-business data into Microsoft Graph for Copilot grounding. In GCC High, external connections and third-party connectors are NOT enabled by default. Each connector enablement brings a new data source into Copilot's grounding surface.",impact:"Each connector is a change-managed event  -  a new data source that Copilot can search and surface. Security and privacy review required before any connector is enabled.",how:"admin.microsoft365.us → Settings → Connectors → review available connectors → define the governance process: Privacy/Security review, data classification, CAB approval, ongoing monitoring. Enable only after completing this process.",gcch:"Connectors are not enabled by default in GCC High. Treat each as a change-managed event with formal review. Document each enabled connector in the authorization record."}]},{id:"pilotprep",label:"Pilot Preparation",sub:"Before First License",bg:"#1E3A5F",acc:"#60A5FA",items:[{id:"pp-2",title:"Build Restricted SharePoint Search Allowed List  -  5 to 10 Clean Sites",pri:"CRITICAL",st:"not-started",what:"Build the initial Restricted SharePoint Search allowed list with 5-10 sites that have been reviewed and cleared. Each site must meet readiness criteria before being added. Separately confirm and document that web grounding is OFF for licensed users.",impact:"The allowed list is the aperture. Everything not on this list is invisible to Copilot. This determines exactly what the pilot can access.",how:"For each candidate site: confirm not in Everyone Except External Users report + sensitivity label applied + site owner confirmed and active + no broken permission inheritance. Add cleared sites: Add-SPOTenantRestrictedSearchAllowedList -SitesList @('https://TENANT.sharepoint.us/sites/SITENAME'). Document each site added with date and approval.",gcch:"PowerShell only in GCC High. Admin URL: TENANT-admin.sharepoint.us"},{id:"pp-3",title:"Select and Brief Pilot Users",pri:"CRITICAL",st:"not-started",what:"Select 20-50 technically capable pilot users who can recognize and report anomalies: IT staff, power users, compliance team, security engineers. Brief every pilot user before license activation  -  not after.",impact:"The right pilot users surface issues early. Unbriefed pilot users are a security and compliance risk from day one.",how:"Selection criteria: understands GCC High data handling, Exchange Online primary mailbox confirmed, already in License Group. Briefing session (30 minutes before license activation): (1) Copilot uses Microsoft Graph within your permission boundary, (2) interactions are stored and subject to retention and eDiscovery, (3) web grounding is OFF, (4) do not enter sensitive content without policy authorization, (5) how to report unexpected behavior.",gcch:"Pilot users must understand the Work vs Web mode distinction and GCC High boundary implications."},{id:"pp-4",title:"Security Officer Notification  -  Level 1 Pilot",pri:"CRITICAL",st:"not-started",what:"Formally notify the security officer before any Copilot licenses are activated. Prepare a briefing package covering the data flow, security controls in place, planned pilot scope, open risk items, and confirmed feedback controls (restricted feedback  -  no verbatim prompt/response data  -  became the default for GCC High on March 31, 2026).",impact:"GCC High environments require security team awareness before new AI tools are activated. This is a process gate, not optional.",how:"Prepare briefing package: data flow diagram, controls summary, pilot scope documentation, open risk register. Include confirmation that restricted feedback is active: admin.microsoft365.us → Settings → Org settings → Microsoft feedback → confirm restricted feedback setting. Brief the security officer → document date, attendees, and acknowledgment received.",gcch:"Level 1 requires awareness and notification at minimum. Level 2 requires formal written sign-off  -  begin that conversation at the Level 1 briefing."}]},{id:"level1",label:"Level 1 Pilot",sub:"Restricted  -  20 to 50 Users",bg:"#0F3460",acc:"#38BDF8",items:[{id:"l1-1",title:"Assign Licenses  -  Pilot Group Only",pri:"CRITICAL",st:"not-started",what:"Assign the M365 Copilot add-on license to selected pilot users ONLY. License assignment activates full Microsoft Graph grounding  -  this is the moment Copilot gains access to tenant data.",impact:"Assigning licenses broadly before readiness is confirmed is a security risk. Every licensed user's email, files, Teams conversations, and SharePoint content becomes accessible to Copilot.",how:"Admin Center → Users → Active Users → select pilot users individually → Licenses → add M365 Copilot add-on. Confirm M365 G3 or G5 Government base license is present for each user before adding the add-on.",gcch:"Confirm base license is Government SKU. Do not assign to users not in the authorized pilot group."},{id:"l1-2",title:"Restricted Pilot Launch",pri:"CRITICAL",st:"not-started",what:"Activate the Level 1 pilot. Pre-launch checklist before communicating to pilot users: licenses assigned, Restricted SharePoint Search enabled with allowed list, web grounding documented OFF, Conditional Access verified, pilot users briefed, security officer notified, audit logging confirmed. Work Mode only  -  no agents.",impact:"This is the discovery phase. The goal is to surface issues before broader deployment while the blast radius is limited to 20-50 users.",how:"Complete checklist → communicate go-live to pilot users → begin daily audit log monitoring. Teams Meeting Copilot and Chat/Channel Copilot are NOT available in GCC High  -  do not include in pilot communications.",gcch:"Work Mode ONLY. No agent enablement. Daily audit monitoring from day one."},{id:"l1-3",title:"Permission Boundary, File Security, and Storage Tests",pri:"CRITICAL",st:"not-started",what:"Three security validation tests to run in the same session: (1) Ask Copilot for content from a site NOT on the Restricted SharePoint Search allowed list  -  verify no results are returned. Ask about an allowed site  -  verify results are returned. Document both. (2) From an unmanaged or non-compliant device, generate a file via Copilot and attempt to download it  -  document whether Conditional Access controls are honored (known GCC High Sev1 concern). (3) Generate files via Copilot across key surfaces and verify the user-facing link path matches actual storage and eDiscovery paths.",impact:"Test (1) is the primary security validation. Test (2) must be documented before Level 2  -  unmanaged device bypass has been raised as a Sev1 concern in GCC High. Test (3) validates the compliance chain for Copilot-generated content.",how:"(1) RSS boundary test: use a pilot licensed account, ask about restricted site content, document result. (2) Unmanaged device test: use a non-enrolled device, generate a Copilot file, attempt download, document result and identify compensating controls. (3) Storage validation: generate files, record URLs, verify storage path via compliance tools.",gcch:"Document all three tests with results before proceeding to Level 2. The unmanaged device test result must be on file."},{id:"l1-4",title:"Audit Log Monitoring and Conditional Access Validation",pri:"CRITICAL",st:"not-started",what:"Two monitoring tasks during the pilot: (1) Check Purview audit logs daily for CopilotInteraction events  -  verify they match expected pilot activity, investigate gaps immediately, export weekly for the security officer. (2) Review Entra sign-in logs to confirm Conditional Access policies are correctly evaluating for Copilot sessions  -  test from a non-compliant device to confirm block behavior.",impact:"Real-time view of what Copilot is doing in the tenant. The sign-in log review confirms Copilot is not bypassing Conditional Access controls.",how:"(1) compliance.microsoft.us → Audit → Interacted with Copilot → last 24 hours → verify events match pilot user activity. (2) entra.microsoft.us → Sign-in logs → filter for Copilot application → verify CA policy evaluated → test block from non-compliant device.",gcch:"Purview portal: compliance.microsoft.us. Entra portal: entra.microsoft.us. Export audit results weekly for security officer review."},{id:"l1-7",title:"Level 1 Exit Criteria Review  -  Gate to Level 2",pri:"CRITICAL",st:"not-started",what:"Formal review of Level 1 outcomes before any expansion. All three permission boundary tests must pass. Document any open issues. Brief the security officer with findings. Receive written acknowledgment before scheduling Level 2.",impact:"This is the gate. Proceeding to Level 2 without the security officer's acknowledgment creates authorization risk.",how:"Prepare findings summary: test results, any anomalies observed, open risk items, proposed compensating controls for anything not passing. Brief security officer → document acknowledgment → schedule Level 2 conversation.",gcch:"Written security officer acknowledgment is required before Level 2 expansion in GCC High. Begin the Level 2 conversation (broader scope, more users, ISSO formal sign-off) at the Level 1 debrief."}]},{id:"ops",label:"Full Operations",sub:"Ongoing Governance",bg:"#1F2937",acc:"#9CA3AF",items:[{id:"op-1",title:"Monthly Governance Audits  -  SharePoint Reports and Label Coverage",pri:"ONGOING",st:"not-started",what:"Monthly cadence on the 1st of each month: (1) Run Sharing Links Activity and Everyone Except External Users Activity reports in Data Access Governance  -  action all flags within 48 hours. (2) Track sensitivity label coverage using Purview Content Explorer  -  target 80%+ label coverage on business-critical sites and report progress to the security officer quarterly.",impact:"Without ongoing monitoring, remediation gains erode continuously as users create new sharing and new content arrives unlabeled.",how:"Calendar reminder → 1st of month → run both Data Access Governance activity reports → action any new Everyone Except External Users flags within 48 hours. Quarterly: Purview Content Explorer → filter by label status → calculate coverage percentage → include in security officer report.",gcch:"Consider automating via the Governance Agent once Phase 11 is active."},{id:"op-3",title:"Service Description and Policy Reviews",pri:"ONGOING",st:"not-started",what:"Two ongoing monitoring responsibilities: (1) Weekly review of Microsoft 365 Message Center, Microsoft Public Sector Blog, and Service Description footnotes for GCC High feature changes  -  Copilot features arrive in GCC High without advance notice. (2) Annual review of all AI-related policies: AI usage policy, Copilot retention policy, DLP Copilot location, feedback controls, and agent governance policy. Update and re-communicate any changes.",impact:"Features arrive in GCC High without warning. Missing an availability change means users find capabilities before the security team has evaluated them. Annual policy reviews ensure governance keeps pace with product evolution.",how:"Weekly: 15-minute scan of Message Center + Public Sector Blog. When a new feature is announced: validate in GCC High tenant before communicating. Annual: calendar reminder → review each policy document → assess whether product changes require updates → brief security officer on changes.",gcch:"Monitor Work/Web grounding model evolution closely  -  any change to how web grounding is controlled must trigger a review of authorization assumptions and ISSO-approved boundary assertions before updating documentation."},{id:"op-5",title:"Governance Agent  -  Automate the Ongoing Cycle",pri:"ONGOING",st:"not-started",what:"Build and deploy a Governance Agent to automate the ongoing governance cycle: continuous oversharing monitoring, policy drift detection, automatic authorization evidence collection, alerts on GCC High feature changes, and on-demand governance status briefs.",impact:"Replaces the manual monthly and quarterly governance cadence with continuous automated monitoring. Without this, the governance workload is a permanent manual overhead.",how:"Build using Copilot Studio + M365 Agents Toolkit + Power Automate + Microsoft Graph APIs. Permissions required: Sites.Read.All, Reports.Read.All, AuditLog.Read.All, Policy.Read.All. All calls to graph.microsoft.us. See agents deck for full architecture and 12-week build plan.",gcch:"Copilot Studio and M365 Agents Toolkit confirmed available in GCC High as of April 2026. All agent calls route to graph.microsoft.us  -  no data exits GCC High. All interactions auditable via Purview."}]}],Jf=[{risk:"Copilot surfaces overshared SharePoint content",control:"RSS limits Copilot to approved, reviewed sites only  -  everything else is invisible until explicitly added",color:"#064E3B",bg:"#D1FAE5"},{risk:"Wrong users access Copilot",control:"CA policy + Integrated Apps (both entries) + Teams permission policy  -  three independent gates, all must be in place simultaneously",color:"#1E3A5F",bg:"#EFF6FF"},{risk:"Data flows outside GCC High boundary",control:"Web grounding OFF by default in GCC High, documented and filed as authorization evidence  -  validate and confirm, do not assume",color:"#7C2D12",bg:"#FEF2F2"},{risk:"Sensitive content sur
