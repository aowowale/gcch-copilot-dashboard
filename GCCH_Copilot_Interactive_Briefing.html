nt, or Teams access","Responses based on prompt input + model knowledge","Web grounding OFF = stays within GCCH when used responsibly","Audit logging behavior for unlicensed Copilot Chat should be validated in the tenant; do not assume CopilotInteraction events are generated","Risk is what users type  -  CUI must never be entered without explicit policy authorization"]},{id:"cv2",label:"Unlicensed Copilot Chat",sub:"Web Grounding ON",filterPhases:["pre","access","unlicensed","adminconfig"],rec:!1,badge:"GCCH BOUNDARY RISK  -  WEB GROUNDING ENABLED",badgeColor:"#991B1B",badgeBg:"#FEE2E2",color:"#7C2D12",grounding:"No tenant grounding. Responses based on prompt input + public web content.",boundary:"When web grounding is enabled, Copilot generates and sends a short derived search query to Bing, which is outside the GCC High boundary. Microsoft documentation confirms that full prompts, tenant documents, and Graph data are not sent to Bing  -  only a minimal query derived from the prompt. In GCC High, Bing is a commercial endpoint outside the sovereign boundary, so this represents a boundary interaction requiring explicit security approval.",compliance:"Data processed outside GCCH boundary. Not appropriate for sensitive or CUI-adjacent workloads without explicit security team approval.",useCase:"Not recommended. If enabled, restrict strictly to non-sensitive use cases with documented risk acceptance.",access:"Any M365 G3/G5 user with base license.",shield:"Enterprise shield = authenticated work identity only. Does NOT mean data stays in GCCH when web grounding is ON.",status:"Web grounding is OFF by default in GCCH. Requires deliberate admin enablement via Cloud Policy.",items:["No tenant data access","Web queries route to commercial Bing  -  outside GCCH boundary","Requires explicit security team approval and documented risk acceptance","Do not enable without ISSO sign-off","Cannot scope per individual user  -  validate granularity in tenant"]},{id:"cv3",label:"Licensed M365 Copilot",sub:"Web Grounding OFF (Recommended)",rec:!0,badge:"RECOMMENDED DEPLOYMENT POSTURE",badgeColor:"#1E40AF",badgeBg:"#DBEAFE",color:"#1D4ED8",filterPhases:["pre","access","unlicensed","sam","purview","monitoring","entra","adminconfig","pilotprep","level1","ops"],grounding:"Full Microsoft Graph grounding across email, files, Teams messages, SharePoint content, and calendar  -  everything the user already has permission to see.",boundary:"Designed to remain within the GCCH boundary when used in Work Mode with web grounding OFF. Behavior should be validated in the tenant.",compliance:"CopilotInteraction audit events captured. Governed by Purview retention for Copilot and AI apps location. Accessible via eDiscovery. Interactions subject to DLP, sensitivity labels, and information barriers.",useCase:"The full Microsoft 365 Copilot experience  -  productivity across every M365 app and surface your team already uses daily.",access:"M365 G3/G5 Government base license + M365 Copilot add-on license. Exchange Online primary mailbox required.",shield:"Enterprise shield = authenticated work identity. In Work Mode with web grounding OFF, GCCH boundary maintained  -  validate in tenant.",status:"Target state for pilot and full production deployment.",valueProps:[{icon:"✉",label:"Summarize email threads",desc:"Instantly catch up on long email conversations. Ask Copilot to summarize a thread, identify action items, or draft a reply based on context."},{icon:"📄",label:"Draft documents and emails",desc:"Describe what you need  -  Copilot drafts it. First drafts of emails, memos, meeting follow-ups, and reports in seconds."},{icon:"🔍",label:"Find anything across M365",desc:"Ask a natural language question  -  Copilot searches across your email, Teams, SharePoint, and files simultaneously to surface the answer."},{icon:"📝",label:"Intelligent Recap (post-meeting notes)",desc:"After a meeting, Copilot generates a summary with key discussion points, decisions, and action items  -  attributed to each speaker. Validate availability in your GCCH tenant."},{icon:"📊",label:"Excel data analysis",desc:"Describe the analysis you want in plain language. Copilot creates formulas, charts, and pivot tables  -  and explains the findings in plain text."},{icon:"📑",label:"PowerPoint drafting",desc:"Describe a presentation topic and Copilot creates a structured slide outline with content. Note: translation, speaker notes generation, and presentation summaries not yet available in GCC High."},{icon:"💬",label:"Teams context and follow-up",desc:"Summarize what you missed while away. Draft follow-up messages based on conversation context. Note: in-meeting Copilot and chat/channel Copilot not yet available in GCC High."},{icon:"🤖",label:"Custom agents (Phase 3)",desc:"After pilot stabilizes: build custom agents grounded in your SharePoint knowledge bases, automating specific workflows  -  help desk, document Q&A, process guidance. Pro-code path in GCC High."}],items:["Full Graph grounding  -  accesses email, files, Teams, SharePoint within user permission boundary","Designed to remain within GCCH in Work Mode with web grounding OFF  -  validate in tenant","CopilotInteraction events auditable in Purview  -  verify CopilotInteraction audit events are being generated","Governed by Purview retention when Copilot and AI apps location is configured  -  MUST be explicitly set","Requires: Exchange Online primary mailbox, M365 Apps on Current or Monthly Enterprise Channel, WebSocket connectivity","NOT yet in GCC High: Teams Meeting Copilot (in-meeting pane), Teams Chat/Channel Copilot, PowerPoint translation/speaker notes, Mac desktop app","Intelligent Recap, DSPM for AI, and other features: validate current availability in your GCCH tenant before communicating"]},{id:"cv4",label:"Licensed M365 Copilot",sub:"Web Grounding ON",filterPhases:["pre","access","unlicensed","sam","purview","monitoring","entra","adminconfig","pilotprep","level1","ops"],rec:!1,badge:"GCCH BOUNDARY RISK  -  WEB GROUNDING ENABLED",badgeColor:"#92400E",badgeBg:"#FEF3C7",color:"#B45309",grounding:"Full Microsoft Graph grounding PLUS public web content via Bing search.",boundary:"When web grounding is enabled, both licensed and unlicensed Copilot generate and send a short derived search query to Bing  -  the same class of boundary interaction. Microsoft documentation confirms that tenant documents, emails, and Graph data are NOT sent to Bing. Licensed Copilot operates under enterprise contractual protections (DPA, no training on data), but the boundary consideration is the same class as unlicensed. Neither is more risky than the other specifically because of tenant data being sent out  -  that does not happen.",compliance:"Licensed tier adds contractual protections  -  but data still routes through commercial Bing infrastructure. Validate implications with ISSO before enabling.",useCase:"Improved response quality for non-sensitive topics. Not appropriate for sensitive workloads without explicit approval.",access:"M365 G3/G5 + M365 Copilot add-on.",shield:"Enterprise shield does not mean web queries stay in GCCH. They do not.",status:"Off by default in GCCH. Requires admin enablement via Cloud Policy. Treat as a risk decision, not a feature upgrade.",items:["Same class of boundary interaction as unlicensed web ON  -  both send only a short derived query to Bing, NOT full documents or tenant data","Microsoft documentation confirms: tenant documents, emails, and Graph data are not sent to Bing  -  only a minimal derived query","Licensed tier adds contractual protections (DPA, no training on your data)  -  stronger than unlicensed","Requires written security team approval and documented risk acceptance before enabling","Real security difference between licensed and unlicensed is when web grounding is OFF  -  not when it is ON","Cannot be scoped per user  -  validate granularity in tenant before communicating as an option"]},{id:"cv5",label:"Copilot Studio",sub:"GCC High  -  Separate Product",filterPhases:["pre","access","adminconfig","ops"],rec:null,badge:"SEPARATE LICENSING  -  VALIDATE GCCH AVAILABILITY",badgeColor:"#4C1D95",badgeBg:"#EDE9FE",color:"#6D28D9",grounding:"Custom agents grounded in data sources you configure: SharePoint, Dataverse, custom APIs. Respects user permissions via Microsoft Graph.",boundary:"Stays within GCCH when using GCCH-approved data sources. External connectors must be individually evaluated.",compliance:"Power Platform DLP governs connector-level behavior. Purview DLP governs content. Both apply. Audit logging via Purview. Separate Power Platform tenant/environment considerations.",useCase:"Custom AI agents for specific workflows: help desk, document Q&A, process automation, knowledge base search.",access:"Separate Copilot Studio licensing. Copilot Studio for US Government available in GCC High. Agent Builder and low-code studio NOT yet confirmed in GCCH  -  only declarative agents via M365 Agents Toolkit (pro-code) currently supported.",shield:"Authentication via Entra ID. Agent permissions are user-delegated  -  cannot exceed user's own access.",status:"Evaluate for Phase 3 (post-pilot). Agent governance policy must be published before enablement.",items:["Separate product from M365 Copilot  -  separate licensing and admin surface","Only declarative agents via M365 Agents Toolkit (pro-code) confirmed in GCCH","Agent Builder and low-code authoring not yet confirmed for GCCH","Power Platform DLP controls which connectors agents can use","Purview DLP controls what content agents can surface","External connectors not enabled by default in GCCH  -  require explicit admin enablement","Each agent is a change-managed event: define data sources, permissions, approval workflow"]}],Yf=[{id:"faq-1",category:"Access",q:"Why can't a user see Copilot in Teams?",a:"Work through these in order: (1) Global Teams App Permission Policy blocks Copilot for all users  -  correct by design. The user must also have the M365_Copilot_Allowed permission policy assigned. (2) Integrated Apps must scope Copilot to the user's group. (3) CA policy must allow the user. (4) Policy changes take time to propagate  -  retest after a significant wait before concluding something is broken.",verify:"Teams Admin Center (admin.teams.microsoft.us) → Users → select user → Policies tab → confirm M365_Copilot_Allowed is assigned. Also check Integrated Apps scoping in admin.microsoft365.us.",gcch:"All three controls must be in place simultaneously. A gap in any one allows or blocks access regardless of the others."},{id:"faq-2",category:"Access",q:"A user shouldn't have Copilot access but they can see it  -  why?",a:"Most likely: Copilot Chat (unlicensed surface) and licensed M365 Copilot are separate service surfaces with separate configuration paths. If only one was scoped in Integrated Apps, the other may remain accessible. Validate both experiences independently.",verify:"admin.microsoft365.us → Settings → Integrated Apps → verify BOTH Microsoft 365 Copilot AND Microsoft 365 Copilot Chat entries are scoped to authorized groups. Then test the unauthorized user's access from Teams and from the M365 portal.",gcch:"Validate both surfaces independently. The separation exists in both product behavior and the compliance boundary."},{id:"faq-3",category:"Licensing",q:"What is the real difference between unlicensed Copilot Chat and licensed M365 Copilot?",a:`The key difference is grounding: unlicensed Copilot Chat does not access tenant data via Microsoft Graph, while licensed M365 Copilot uses Graph to retrieve content the user already has access to.

Unlicensed Copilot Chat: no tenant Graph grounding. Responses are based on prompt input and model knowledge only.

Licensed M365 Copilot (Work Mode, web grounding OFF): uses Microsoft Graph to access content the user already has permission to see. Stays within GCCH in this configuration.

With web grounding ON (either tier): web grounding may route prompt data outside the GCCH boundary. Validate behavior in your tenant and ensure explicit security team approval before enabling.`,verify:"Log in as unlicensed Chat Authorized user → prompt 'summarize my emails' (should return nothing tenant-grounded). Log in as licensed user in Work Mode → same prompt should return actual email summaries.",gcch:"Unlicensed Copilot Chat should be treated as potentially outside the GCCH boundary unless tenant documentation explicitly states otherwise. See the Copilot Versions section for the full comparison."},{id:"faq-4",category:"Licensing",q:"The enterprise shield appears on Copilot Chat  -  does that mean we are protected?",a:`No. The enterprise shield indicates a signed-in work identity only. It does not confirm GCCH boundary enforcement, retention coverage, or compliance scope.

The shield appears based on how you signed in, not which compliance controls are active for that session. For ATO purposes, verify actual controls: web grounding setting, retention policy coverage, CA policy application, and data flow documentation.`,verify:"Do not use the shield as ATO evidence. Verify: web grounding setting confirmed OFF, Purview retention policy explicitly covers Copilot and AI apps location, CA policy is evaluated in sign-in logs.",gcch:"Do not cite the enterprise shield as evidence of GCCH compliance in customer communications or ATO documentation. It confirms authenticated work identity only."},{id:"faq-5",category:"Licensing",q:"Teams Premium users want Intelligent Recap  -  do they need an M365 Copilot license?",a:`Validate in your tenant with your specific license combination  -  do not assume based on commercial documentation.

Critical distinction: Intelligent Recap (post-meeting AI notes, action items, chapters) is different from Teams Meeting Copilot (interactive in-meeting AI pane). Teams Meeting Copilot is NOT available in GCCH. Intelligent Recap may work with M365 Copilot license  -  test before communicating.`,verify:"Assign intended license combination to test user. Run 2-minute Teams meeting with transcription. Check Recap tab. Document each feature as accessible or locked. Use observed tenant behavior.",gcch:"Teams Meeting Copilot (Footnote 6) NOT available in GCCH. Intelligent Recap GCCH availability must be determined by tenant testing."},{id:"faq-6",category:"Governance",q:"Is web grounding really OFF? How do we confirm and document it?",a:`In GCC High, web grounding is OFF by default. However, default does not substitute for explicit confirmation and authorization documentation.

When web grounding is ON, Copilot generates and sends a short derived search query to Bing  -  outside the GCC High sovereignty boundary. Microsoft documentation explicitly confirms that full prompts, tenant documents, and Graph data are NOT sent to Bing. Only a minimal derived query leaves the boundary. In GCC High, Bing is a commercial endpoint, so this boundary interaction requires explicit security team approval and formal risk acceptance documentation regardless of the minimal nature of what is transmitted.`,verify:"admin.microsoft365.us → Settings → Copilot settings → locate web grounding / web search control → confirm OFF → screenshot with admin account and date → file to authorization evidence folder.",gcch:"Verify this setting for both unlicensed Copilot Chat and licensed M365 Copilot. Do not enable without written security team approval and formal risk acceptance documentation. ZQL context: Zero Query Logging (ZQL), if active in your environment, ensures Bing does not retain the derived query after processing - covering query text, identifiers, and prompt signals. ZQL is a retention control only; it does not eliminate the boundary crossing or the approval requirement."},{id:"faq-7",category:"Governance",q:"Can we enable web grounding for just one user or group?",a:"Validate in your tenant before asserting. The admin control is cloud-policy-based and may support per-group targeting  -  confirm whether your GCCH tenant supports scoped enablement before communicating it as an option.",verify:"admin.microsoft365.us → Copilot settings → check whether web grounding Cloud Policy can be scoped to a group. Document finding before communicating to ISSO.",gcch:"Do not assert per-user/group scoping without tenant verification. Treat it as tenant-wide unless confirmed otherwise."},{id:"faq-8",category:"Data Governance",q:"Our data is a mess  -  nothing labeled, 249 oversharing sites. Can we still deploy Copilot safely?",a:`Yes  -  with layered controls. Tenant grounding cannot be disabled while keeping licensed Copilot active. What you control is the aperture.

RSS (Restricted SharePoint Search): tenant-wide. Limits which SP sites Copilot and Search can access. Sites not on your allowed list are invisible to Copilot. PowerShell only. Temporary  -  disable when remediation complete.

RCD (Restricted Content Discovery): per-site. Removes site from Copilot and Search without changing permissions. Available in SharePoint Admin Center UI.

RCA/RSA (Restricted Access Control): per-site hard boundary. Limits access to a named Entra security group. Changes actual permissions. Permanent governance.

Recommended: enable RSS with narrow initial allowed list. Apply RCD to highest-risk sites. Apply RCA to most sensitive sites. Expand RSS as sites clear readiness criteria. Disable RSS when governance posture is sound.`,verify:"Validate each control in tenant before citing in ATO documentation. RSS: Get-SPOTenantRestrictedSearchAllowedList. RCD: SharePoint Admin → Active sites → site → Settings. RCA: same path, Restricted access control.",gcch:"All three controls available in GCCH. Validate behavior per control  -  do not assume commercial parity."},{id:"faq-9",category:"Data Governance",q:"What SharePoint sites can Copilot currently see?",a:`If RSS is enabled, Copilot can only see sites on the allowed list. If disabled, Copilot reaches any SharePoint content the user has access to  -  including all 249 oversharing sites.

Important: RSS does not restrict OneDrive or Exchange. Users' own files and email are always accessible to Copilot regardless of RSS state.`,verify:"Connect-SPOService -Url 'https://TENANT-admin.sharepoint.us' then run Get-SPOTenantRestrictedSearchAllowedList. Validate in tenant before asserting in documentation.",gcch:"PowerShell only for RSS management in GCCH. Admin URL: TENANT-admin.sharepoint.us"},{id:"faq-10",category:"Compliance",q:"Does our DLP policy actually protect Copilot interactions?",a:`Validate in tenant  -  DLP policies must explicitly include Microsoft 365 Copilot as a protected location. Existing Teams/SharePoint/Exchange policies do NOT automatically cover Copilot. Enforcement behavior in GCCH should be tested and documented; do not assume parity with commercial environments.

SIT-based prompt blocking is not confirmed available in GCCH. Label-based conditions are the current supported approach.`,verify:"compliance.microsoft.us → DLP → Policies → open each policy → Locations tab → confirm Microsoft 365 Copilot is an included location. Test enforcement explicitly  -  document what was tested and what was observed.",gcch:"Do not assume DLP enforcement parity with commercial. Known enforcement gaps exist in GCCH Copilot. Test, document, and report findings to ISSO."},{id:"faq-11",category:"Compliance",q:"Does our retention policy cover Copilot interactions?",a:`Retention policies created prior to Copilot may not include the Copilot and AI apps location. Verification and explicit configuration are required.

Microsoft separated the Copilot interactions location from Teams chats  -  older policies and policies targeting Teams chats do not automatically cover Copilot prompt and response data.

This has no technical dependencies and can be completed immediately: create a new policy targeting only the Copilot and AI apps location. Treat as urgent  -  unretained Copilot data is an ATO gap.`,verify:"compliance.microsoft.us → Data Lifecycle → Retention Policies → review each policy → Locations tab → look for Microsoft 365 Copilot and Copilot Chat or Copilot and AI apps as an explicit location.",gcch:"Purview portal for GCCH: compliance.microsoft.us. The Copilot-specific location is separate from Teams chats. Any policy not explicitly listing it does not cover Copilot interactions."},{id:"faq-12",category:"Compliance",q:"Where are Copilot prompts stored? Can we eDiscover them?",a:`Copilot interaction data is processed within Microsoft 365 services and is discoverable via Purview audit and eDiscovery using the CopilotInteraction activity type. The underlying storage implementation should not be assumed and must not be cited as evidence in ATO documentation  -  compliance validation should rely on observable controls: audit logs, retention policies, and eDiscovery results.

For compliance: if your Purview retention policy covers the Copilot and AI apps location, interactions are governed by that policy and accessible via eDiscovery.`,verify:"compliance.microsoft.us → Audit → Activities: Interacted with Copilot → run for known pilot activity → confirm events appear with expected metadata. Test eDiscovery: create a case, search for Copilot interactions, confirm discoverability. Use these results as ATO evidence.",gcch:"Cite observable controls (audit log events, eDiscovery results, retention policy configuration) as ATO evidence  -  not assumptions about backend storage services."},{id:"faq-13",category:"Troubleshooting",q:"Copilot is missing in Outlook  -  where do we start?",a:`Work through in order:

1. M365 Apps update channel: Semi-Annual Enterprise Channel does NOT support Copilot. Most common silent blocker in gov environments.

2. Optional Connected Experiences: if disabled org-wide, Copilot UI is removed from Office apps. Check before diagnosing anything else.

3. Microsoft People Cards Service principal: multiple GCCH tenants have had Copilot missing in Outlook Classic because this dependency was disabled.

4. License and service plan: confirm add-on assigned and service plan active.

5. CA policy: confirm user is in authorized group via sign-in logs.`,verify:"Start with update channel. Then: entra.microsoft.us → Enterprise applications → search People Cards → confirm enabled. Then: Admin Center → Users → user → Licenses → confirm Copilot add-on.",gcch:"Do not skip the update channel check. Connected Experiences and People Cards SP are GCCH-specific known issues."},{id:"faq-14",category:"SAM",q:"How do we run the SAM reports and what do they show?",a:`SAM provides two report types:

Content Management Assessment: automated tenant-wide scan across 5 categories  -  inactive sites, ownerless, broken inheritance, EEEU permissions, overpermissive sharing links. Takes 2-72 hours. Run FIRST.

DAG Reports: on-demand. Site Permissions Snapshot sorts every site by total permissioned users with EEEU flag. Sharing Links Activity and EEEU Activity show new oversharing in the past 28 days  -  use monthly.

For this deployment: run Content Management Assessment immediately. Export DAG Site Permissions Snapshot as CSV  -  that is your prioritized remediation list.`,verify:"admin.microsoft365.us → SharePoint Admin Center → Advanced Management → Start Assessment. GCCH SharePoint Admin URL: TENANT-admin.sharepoint.us. If Advanced Management not visible, wait 24h for license propagation.",gcch:"SAM is included with M365 Copilot license. Validate in tenant that Advanced Management is accessible."},{id:"faq-15",category:"Compliance",q:"What is the Purview Edge add-in and do we need it?",a:`The Microsoft Purview browser extension for Edge extends DLP and sensitivity labeling to browser-based activities including browser-based Copilot Chat sessions and content accessed via Edge.

Relevant for: DLP enforcement in browser workflows, users accessing Copilot via browser rather than Teams or Office apps, and Endpoint DLP integration.

GCCH-specific behavior must be validated in tenant before relying on it for compliance documentation. Proxy and TLS inspection can affect extension behavior.`,verify:"Install extension in Edge for a test user. Trigger a DLP policy condition in a browser workflow. Confirm expected block or notification behavior. Document what was tested.",gcch:"GCCH-specific extension behavior needs tenant validation. Do not represent as a confirmed control without testing."},{id:"faq-16",category:"Availability",q:"Is Teams Meeting Copilot or Teams Chat Copilot available in GCCH?",a:`Teams Meeting Copilot (interactive in-meeting AI pane): NOT available in GCCH per service description. Do not communicate as available.

Copilot in Teams chat and channels: NOT yet available in GCCH per service description. Do not communicate as available.

Intelligent Recap (post-meeting AI notes): validate availability in your specific tenant with your license combination.

Check service description footnotes and Microsoft Public Sector Blog before communicating any Teams Copilot capability. Features arrive in GCCH without advance notice.`,verify:"Assign intended license to test user. Run short Teams meeting with transcription. Check Recap tab. Document what is accessible vs locked.",gcch:"Service description is the authoritative source. Do not rely on commercial documentation not explicitly confirmed for GCC or GCCH."},{id:"faq-17",category:"Governance",q:"Can Copilot agents bypass SharePoint access controls or RSS restrictions?",a:`Copilot agents operate within the Microsoft Graph permission model  -  they cannot access content the user does not have access to.

For RSS specifically: validate in tenant whether agents respect RSS restrictions. The permission enforcement model is well-documented but RSS interaction with agents should be explicitly tested before publishing agents to users.`,verify:"Create a test agent, enable RSS, ask the agent to retrieve content from a site not on the RSS allowed list. Document observed behavior before publishing any agents.",gcch:"Agent Builder rolling out in GCCH as of April 2026. No group-level controls on who can create agents exist today. Publish an agent governance policy before users create agents independently."},{id:"faq-18",category:"Compliance",q:"What is Power Platform DLP and how is it different from Purview DLP?",a:`These are two completely separate DLP systems that protect different things. You need both.

PURVIEW DLP  -  Content Protection:
Purview DLP inspects actual data content (files, emails, Copilot prompts/responses). It blocks or audits based on what the data contains  -  sensitivity labels, sensitive information types (SITs), or other content conditions. It protects data in SharePoint, OneDrive, Exchange, Teams, and Microsoft 365 Copilot. This is your data-level control.

POWER PLATFORM DLP  -  Connector Governance:
Power Platform DLP operates at the connector level in Power Platform Admin Center. It governs which connectors (SharePoint, HTTP, custom APIs, etc.) Power Automate flows and Power Apps can use together. It does NOT inspect data content  -  it controls which services can be combined. Connectors are sorted into Business (can be combined) and Non-Business/Blocked buckets.

For Copilot Studio agents built with Power Automate: BOTH apply simultaneously. Power Platform DLP governs what external services the agent's flow can connect to. Purview DLP governs what content the agent can surface to users. A gap in either one creates a compliance exposure.`,verify:"Power Platform DLP: admin.powerplatform.microsoft.com (or equivalent GCCH URL) → Policies → Data policies. Purview DLP: compliance.microsoft.us → Data Loss Prevention → Policies.",gcch:"Power Platform DLP uses the Power Platform Admin Center, separate from M365 Admin Center. For GCCH, confirm the correct admin URL for your Power Platform environment."},{id:"faq-19",category:"Availability",q:"What features are NOT available in GCC High right now?",a:`Confirmed NOT available (as of May 2026):

- Teams Meeting Copilot (in-meeting AI pane)  -  Footnote 6
- Copilot in Teams chat and channels  -  Footnote 7
- M365 Copilot app for Mac (desktop)
- Copilot Chat in Edge sidebar
- Built-in agents: Researcher and Analyst  -  targeted 1H 2026, not confirmed
- Agent Builder and low-code Copilot Studio authoring  -  pro-code M365 Agents Toolkit only
- Copilot in Excel with Python
- PowerPoint: translation, speaker notes, presentation summaries, Copilot-powered slide creation
- Microsoft Security Copilot  -  not available in any government cloud
- DSPM for AI 'Browse to URL' policies  -  only Microsoft-supported AI sites surfaced
- External connectors for Graph  -  not enabled by default

Validate current state against the Microsoft 365 Service Description and Public Sector Blog before communicating to users.`,verify:"Microsoft 365 Service Description → GCC High footnotes. Microsoft Public Sector Blog for announcements. Message Center for your tenant.",gcch:"Features arrive without advance warning. Establish a weekly Service Description review process."},{id:"faq-20",category:"Data Governance",q:"What is Microsoft 365 Archive and how does it relate to Copilot?",a:`Microsoft 365 Archive is a pay-as-you-go service that stores inactive SharePoint site content at a lower cost tier while removing it from Copilot's grounding reach.

Key behavior: content placed in Archive is excluded from Microsoft 365 Copilot processing and grounding. Copilot cannot surface archived content. The content is still preserved for eDiscovery and recordkeeping  -  it is just invisible to Copilot.

Use cases:
- Store legacy or inactive sites cheaply while keeping them out of Copilot responses
- Exclude high-value but inactive content from AI processing
- Reduce oversharing exposure without deleting content you cannot delete

This is an Azure Consumption-based service (excluded from M365 Copilot licensing). Factor into budget planning.`,verify:"admin.microsoft365.us → SharePoint Admin Center → Archive policies. Review pricing before deploying at scale.",gcch:"Validate GCCH availability via the Service Description. Archive is listed in the E3/E5 FastTrack workbook as an option for excluding inactive content from Copilot."},{id:"faq-21",category:"Availability",q:"What is Copilot Studio and how does it work in GCCH?",a:`Copilot Studio is a separate Microsoft product for building custom AI agents and chatbots. It is NOT part of the M365 Copilot license  -  it requires separate licensing.

In GCC High: Copilot Studio for US Government has been available since February 2022. However, only declarative agents created with the Microsoft 365 Agents Toolkit (pro-code path) are currently confirmed for GCCH. Agent Builder and low-code studio authoring are not yet confirmed.

Key differences from M365 Copilot:
- Copilot Studio agents have custom-defined data sources, not automatic Graph grounding
- Power Platform DLP governs what connectors agents can use
- Separate admin surface: Power Platform Admin Center
- Agents can be published to Teams, SharePoint, or the M365 Copilot surface
- Each agent is a change-managed event requiring its own governance review

For this deployment, Copilot Studio is a Phase 3 workstream  -  after the M365 Copilot pilot is stable.`,verify:"Power Platform Admin Center (GCCH equivalent URL) → confirm Copilot Studio licensing is assigned. Test creating a simple agent in a dev environment before production.",gcch:"Only pro-code declarative agents via M365 Agents Toolkit confirmed. Validate current low-code availability status before communicating to users."},{id:"faq-22",category:"Governance",q:"What is the Work/Web merge and 'automatic grounding'  -  should we be tracking this?",a:`Microsoft is evolving Copilot experiences toward more automatic grounding across tenant and web data sources. This may reduce reliance on explicit Work/Web mode toggles in the future. The exact control model, naming, and availability in GCC High should be validated as updates are released.

Why this matters for your deployment: the current security posture documented for authorization relies on web grounding being OFF as an admin-controlled setting. If Microsoft changes how grounding is controlled  -  moving from an explicit toggle to automatic routing  -  the mechanism for enforcing that boundary posture changes. Any change to how grounding is controlled must trigger a review of authorization assumptions, control documentation, and security team-approved boundary assertions.

Do not assert that the toggle will be removed, that a specific feature name is confirmed, or that any timeline applies to GCC High until validated in the tenant.`,verify:"Monitor: Microsoft 365 Message Center, Microsoft Public Sector Blog, Service Description updates. When a relevant change is announced: (1) validate behavior in GCC High tenant, (2) determine whether the admin control mechanism changes, (3) review authorization documentation and notify security team if controls are affected.",gcch:"Changes to commercial Copilot do not automatically apply to GCC High. Validate GCC High-specific behavior before updating any compliance documentation."},{id:"faq-23",category:"Licensing",q:"What does 'Enterprise Data Protection' on the Copilot shield mean? And from a security standpoint, what does the license buy us in GCC High?",a:`Two questions that deserve direct answers.

WHAT ENTERPRISE DATA PROTECTION ACTUALLY MEANS:
Enterprise Data Protection (EDP) ensures that prompts and responses are handled under Microsoft's enterprise security, privacy, and compliance terms  -  including encryption, isolation, and contractual data handling protections. This applies to both licensed and unlicensed Copilot Chat when signed in with a work account.

What EDP does NOT guarantee: that your tenant-specific controls are configured or effective. Sensitivity labels, Data Loss Prevention policies, retention policies, and conditional access rules only protect your environment if they are correctly configured. EDP does not configure them for you and does not verify they are active. EDP covers Microsoft's handling of your data. Your controls cover your environment's governance posture. These are separate concerns.

WHAT THE LICENSE BUYS FROM A SECURITY PERSPECTIVE:
The M365 Copilot license does not make your GCC High environment more secure. Your security controls make it secure. The license enables Copilot to operate on tenant data using Microsoft Graph. When that happens, your existing controls  -  permissions, sensitivity labels, Data Loss Prevention, retention, and audit  -  are applied to Copilot interactions.

Controls exist regardless of the license. But Copilot only interacts with and enforces them when operating on tenant data via Graph. Without the license, Copilot has no tenant data access, so your controls have nothing to govern in the context of Copilot behavior. With the license:
- Sensitivity labels and information barriers are respected
- Data Loss Prevention policies apply to Copilot's retrieval and surfacing of content
- Copilot audit events are generated  -  interactions become discoverable
- Retention policies apply when the Copilot and AI apps location is configured
- Data processing occurs under Microsoft Product Terms and Data Protection Addendum for M365

Copilot does not introduce new access. It amplifies existing permissions and data exposure patterns. If oversharing exists in the tenant, Copilot surfaces that exposure faster and more efficiently than a human could. This is why Restricted SharePoint Search, Restricted Content Discovery, and sensitivity labeling must precede broad deployment.

One common misconception worth addressing directly: when web grounding is ON, neither licensed nor unlicensed Copilot sends full tenant documents or Graph data to Bing. Both send only a short derived search query. The boundary interaction is the same class for both. Licensed Copilot is not more risky than unlicensed specifically because tenant data gets sent out  -  it does not. The real security difference lives in the web grounding OFF state: licensed accesses tenant data via Graph with your controls applied and everything stays within GCC High; unlicensed has no tenant data access at all.

Bottom line: the license is not a security control. It is what enables your security controls to be applied to Copilot behavior.`,verify:"Validate that CopilotInteraction audit events are generated for licensed users: run a Purview audit search after a test interaction. Confirm events appear with expected metadata. This confirms the audit trail that forms part of your authorization evidence.",gcch:"In GCC High, the licensed M365 Copilot path is designed to keep processing within the GCC High boundary in Work Mode with web grounding OFF. The unlicensed path has Enterprise Data Protection from Microsoft's side, but no tenant-specific compliance governance path  -  no audit events, no retention policy application, no Data Loss Prevention enforcement against Copilot behavior."},{id:"faq-25",category:"Licensing",q:"Is licensed M365 Copilot actually more risky than unlicensed Copilot Chat when web grounding is ON? Does tenant data get sent to Bing?",a:`No  -  and this is one of the most common misconceptions worth correcting directly.

WHAT ACTUALLY HAPPENS WHEN WEB GROUNDING IS ON:
Both licensed M365 Copilot and unlicensed Copilot Chat generate and send a short derived search query to Bing. Microsoft documentation explicitly confirms that full prompts, tenant documents, emails, and Microsoft Graph data are NOT sent to Bing. Only a minimal query derived from the prompt leaves the boundary.

THE RISK COMPARISON (web grounding ON):
- Unlicensed Copilot Chat: sends a derived query to Bing (based on what the user typed)
- Licensed M365 Copilot: sends a derived query to Bing (based on prompt + context)
- Both are the same class of boundary interaction
- Licensed is NOT more risky because tenant data is sent out  -  it is not
- Licensed operates under stronger contractual protections (DPA, no training on your data)

WHERE THE REAL DIFFERENCE LIVES (web grounding OFF):
- Unlicensed: no tenant data access at all. EDP applies but your compliance controls have nothing to govern in Copilot context.
- Licensed: full Graph grounding within GCC High boundary. Your DLP, sensitivity labels, retention, and audit all apply. This is the controlled, compliant path.

THE ENTERPRISE SHIELD:
The shield appears on both because Enterprise Data Protection (EDP) applies to both  -  meaning Microsoft handles the session under enterprise contractual terms (no training on your data, enterprise privacy terms, DPA). It does NOT mean GCC High boundary is enforced, web grounding is off, or your compliance controls are active.`,verify:"Review Microsoft's Enterprise Data Protection documentation at learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection for the authoritative statement on what is and is not sent to Bing.",gcch:"In GCC High, Bing is a commercial endpoint outside the sovereign boundary. Even though only a derived query is sent, that boundary crossing requires explicit security team approval and documented risk acceptance before enabling web grounding. Zero Query Logging (ZQL) is a related privacy control: when active, Bing routes the query to a no-logging index and does not retain the query, identifiers, or prompt signals after processing. ZQL is a retention control, not a boundary elimination - the approval requirement remains regardless of ZQL status."},{id:"faq-24",category:"Data Governance",q:"We applied RSS to restrict SharePoint sites but content from restricted sites is still surfacing in Copilot. Why?",a:`This is a documented limitation of Restricted SharePoint Search that every deployment team should understand.

RSS restricts Copilot's SharePoint SEARCH path  -  sites not on the allowed list are excluded from search-based discovery. However, Copilot uses Microsoft Graph for multiple signal types beyond search, including:

- Recently accessed files: Copilot uses Microsoft Graph signals beyond SharePoint search, including user activity data. Content from restricted sites that a user has recently interacted with may still surface depending on implementation and recency signals
- Recently received email attachments from restricted site content
- Recently engaged Teams content

RSS controls the search path. It does not retroactively remove items from a user's recent activity context in Microsoft Graph.

PRACTICAL IMPLICATION: RSS alone is insufficient if users have recently interacted with content from high-risk sites. The required combination is:
- RSS to limit new search-based discovery going forward
- RCD (Restricted Content Discovery) on high-risk sites  -  this removes the site from the discovery surface more comprehensively, not just from search
- RCA (Restricted Access Control) for the most sensitive content  -  this changes actual permissions, which affects the Graph activity path

The recent-activity signal typically fades after approximately 30 days of no access. For immediate control, apply RCD to sites where users have recent interaction history.`,verify:"After applying RSS, ask Copilot to surface content you know a user has recently accessed from a restricted site. If it still appears, confirm via Purview audit whether the interaction used the search path or the activity/Graph path. This will identify whether RCD is also required.",gcch:"Validate this behavior in your specific GCC High tenant. The interaction between RSS and the Graph activity feed should be tested and documented before citing RSS as a comprehensive control in authorization documentation."}],Kf=[{id:"act-1",title:"Validate Copilot interaction discoverability via Purview audit and eDiscovery",owner:"",due:"",status:"Resolved",notes:"VALIDATED. For licensed M365 Copilot: interactions are processed within the M365 service boundary and stored in the user's Exchange Online mailbox (hidden folder) - auditable via Purview and discoverable via eDiscovery. ATO-safe statement: 'Microsoft 365 Copilot interactions are processed within the Microsoft 365 service boundary and are auditable via Microsoft Purview. For licensed Copilot, prompt/response data is stored in Exchange Online and is discoverable via eDiscovery and audit logs.' For unlicensed Copilot Chat: limited content logging - audit visibility primarily via Entra and session metadata. Evidence paths to cite: Purview Audit (CopilotInteraction events), eDiscovery (Exchange Online mailbox content), Microsoft Learn enterprise data protection documentation."},{id:"act-2",title:"Confirm web grounding granularity in GCCH  -  per-group or tenant-wide only",owner:"",due:"",status:"Open",notes:"Web grounding is controlled via Microsoft 365 Cloud Policy, which supports scoped targeting in commercial environments. In GCCH, the availability and granularity of this control must be explicitly validated in the tenant before being relied upon or communicated to the ISSO. Until confirmed, treat as a tenant-level control."},{id:"act-3",title:"Validate Intelligent Recap with Copilot-only license (no Teams Premium)",owner:"",due:"",status:"Open",notes:"Run test meeting with Copilot-only licensed user. Check Recap tab. Document each feature as accessible or locked."},{id:"act-4",title:"Run SAM Content Management Assessment  -  establish baseline",owner:"",due:"",status:"Open",notes:"Start immediately  -  takes 2-72 hours. SharePoint Admin → Advanced Management → Start Assessment."},{id:"act-5",title:"Test Edge Purview add-in behavior in GCCH network environment",owner:"",due:"",status:"Open",notes:"Proxy/TLS config may affect behavior. Validate before citing as control in ATO documentation."},{id:"act-7",title:"Test DLP enforcement against Copilot  -  validate label-based condition blocks",owner:"",due:"",status:"Open",notes:"Known DLP gaps in GCCH Copilot. Test and document observed behavior. Do not assume coverage."},{id:"act-8",title:"Create Purview retention policy for Copilot and AI apps location",owner:"",due:"",status:"Open",notes:"This action has no technical dependencies and can be completed immediately. compliance.microsoft.us → Data Lifecycle → Retention Policies → New → Locations: Microsoft 365 Copilot and Copilot Chat ONLY  -  separate from Teams chats policy. Until this exists, Copilot interaction data has no governed retention  -  an ATO gap."},{id:"act-11",title:"Configure Power Platform DLP  -  Phase 3 (Copilot Studio) pre-production gate",owner:"",due:"",status:"Resolved",notes:"Not required for M365 Copilot pilot or rollout. Reclassified as a Phase 3 (Copilot Studio) pre-production gate  -  must be configured before any Copilot Studio agent goes to production. Power Platform DLP governs connector behavior for agents and is separate from Purview DLP. Configure in Power Platform Admin Center (GCCH equivalent URL)."},{id:"act-12",title:"Monitor Copilot grounding model changes  -  Work/Web convergence",owner:"",due:"",status:"Open",notes:"Microsoft is evolving Copilot experiences toward more automatic grounding across tenant and web data sources. This may reduce reliance on explicit Work/Web toggles. Monitor: Message Center, Microsoft Public Sector Blog, Service Description updates. Any change to how grounding is controlled must trigger a review of authorization assumptions, web grounding control documentation, and security officer-approved boundary assertions before updating documentation. Do not assume commercial announcements reflect GCC High availability or timeline."},{id:"act-steven",title:"Send Steven the known bugs list",owner:"",due:"",status:"Resolved",notes:"RESOLVED. Validated bugs list ready to send to Steven: (1) Enterprise Shield confusion - indicates EDP (enterprise data protection terms), NOT GCC High boundary enforcement and does not indicate whether web grounding is active or if data leaves GCC High. (2) Web grounding Bing routing - routes derived search queries only (not full prompts or tenant data) to commercial Bing endpoints when enabled; OFF by default in GCC High. (3) SharePoint / People Card inconsistencies - people card metadata and permissions not always aligned with Copilot retrieval experience; can surface perceived unexpected content based on underlying permissions. (4) Optional Connected Experiences dependency - certain Copilot capabilities silently degrade when this setting is disabled (common via FedRAMP hardening policies). (5) WebSocket / network reliability issues in AVD/VPN - impacts Copilot responsiveness and streaming; often tied to proxy inspection and TLS handling. (6) M365 Apps update channel dependency - Copilot features gated by update channel; Semi-Annual = missing capabilities. (7) DLP enforcement gaps in GCC High - known limitations in how label/DLP policies enforce in Copilot scenarios; must be tested, do not assume parity with Exchange/SharePoint enforcement."}],Xf=["Open","In Progress","Resolved","Blocked"],Zf=["All","Access","Licensing","Governance","Data Governance","Compliance","SAM","Availability","Troubleshooting"],_i=[{id:"pre",label:"Pre-Deployment",sub:"Foundation",bg:"#1E3A5F",acc:"#60A5FA",items:[{id:"pre-1",title:"GCC High Tenant Verification",pri:"CRITICAL",st:"complete",what:"Confirm the tenant is genuine GCC High: all admin experiences should use .us domain endpoints (portal.office365.us, admin.microsoft365.us). The Microsoft 365 Admin Center should explicitly display GCC High as the cloud environment.",impact:"Running configuration or testing in the wrong environment invalidates all results and may expose data outside the GCC High boundary.",how:"Navigate to admin.microsoft365.us. Confirm the URL stays on a .us domain throughout. Admin Center → Settings → Org settings → cloud environment should read GCC High. Do not validate using .com surfaces.",gcch:"Authentication routes through login.microsoftonline.us. All GCC High admin portals use .us domains. Commercial .com portals show a different tenant."},{id:"pre-2",title:"Network, Transport Security & WebSocket Validation",pri:"CRITICAL",st:"complete",what:"Validate three things together from a pilot device on the corporate network: (1) Outbound HTTPS to *.office365.us and *.microsoftonline.us is allowed. (2) TLS inspection is NOT intercepting Microsoft 365 traffic. (3) WebSocket connections succeed for *.gov.cloud.microsoft and *.office.com. Run the official Microsoft 365 Copilot Network Connectivity Test to capture results as authorization evidence.",impact:"TLS inspection breaking Microsoft 365 connections is the most common Copilot authentication failure. WebSocket failures cause Copilot to hang silently even when HTTPS looks healthy. Both must be confirmed before licenses are assigned.",how:"From a pilot workstation: (1) confirm firewall allows *.office365.us and *.microsoftonline.us with TLS bypass. (2) Test WebSocket connectivity  -  if a proxy is in-path confirm it supports WebSockets. (3) Navigate to connectivity.m365.cloud.microsoft/copilot and run the official test. Save the results as a PDF for authorization evidence.",gcch:"GCC High endpoints must be excluded from TLS/SSL inspection appliances. WebSocket failures are a recurring GCC High Copilot deployment hard blocker. The connectivity test tool resolves against .us endpoints  -  run from the corporate network, not VPN unless VPN is the production path."},{id:"pre-2c",title:"M365 Apps, Connected Experiences & Outlook Client Check",pri:"CRITICAL",st:"complete",what:"Three checks in one pass for a licensed pilot user: (1) Confirm 'Allow connected experiences in Office' and 'Allow connected experiences that analyze content' are both enabled  -  both are required for Copilot in Word, Excel, PowerPoint, Outlook, and Teams. (2) Confirm Microsoft 365 Apps is on Current Channel or Monthly Enterprise Channel  -  Semi-Annual does not support Copilot. (3) Confirm the Outlook client is a supported version. If Copilot is missing in Outlook Classic, check whether the Microsoft People Cards service principal is disabled in Entra  -  this is a documented GCC High issue.",impact:"Disabling Connected Experiences via FedRAMP privacy hardening removes Copilot from all Office apps. Semi-Annual Channel is the most common silent deployment blocker in government environments. Both issues present as 'Copilot missing' with no obvious error.",how:"Review Cloud Policy or Group Policy for M365 Apps privacy settings. Validate the update channel in Microsoft 365 Apps admin or Intune. For Outlook Classic: sign in as a licensed pilot user and confirm Copilot appears in the ribbon. If not: entra.microsoft.us → Enterprise applications → search People Cards → confirm enabled.",gcch:"Check Connected Experiences and update channel BEFORE diagnosing licensing or pinning. FedRAMP-driven privacy hardening is the most common cause in government environments. People Cards SP issue has been confirmed across multiple GCC High tenants."},{id:"pre-3",title:"Multi-Factor Authentication via Conditional Access",pri:"CRITICAL",st:"complete",what:"Confirm MFA is enforced for all Copilot-bound users via Conditional Access policy. This is a prerequisite, not an enhancement.",impact:"A compromised account without MFA gives an attacker full access to everything Copilot can surface  -  email, files, Teams, SharePoint  -  via natural language query with no additional effort.",how:"entra.microsoft.us → Conditional Access → confirm MFA required for Microsoft 365 apps for all pilot users. Test sign-in from a pilot account to confirm MFA prompts.",gcch:"Entra admin portal for GCC High: entra.microsoft.us. Authentication endpoint: login.microsoftonline.us."},{id:"pre-4",title:"Licensing and Exchange Online Verification",pri:"CRITICAL",st:"complete",what:"Confirm two prerequisites for every pilot user: (1) M365 G3 or G5 Government base license is assigned  -  the Copilot add-on cannot activate without a qualifying base. (2) Primary mailbox is in Exchange Online  -  on-premises Exchange is not supported and breaks Copilot interaction storage and eDiscovery.",impact:"Add-on without qualifying base = silent failure. On-premises mailbox = no audit trail, no retention, no eDiscovery for Copilot interactions.",how:"Admin Center → Active Users → select each pilot user → verify G3/G5 Government license and Exchange Online as primary mailbox provider. For bulk validation: Get-EXOMailbox to confirm Exchange Online status for all pilot accounts.",gcch:"Government SKUs: M365 G3 or G5 Government. Not commercial E3/E5."},{id:"pre-5",title:"Microsoft 365 Apps Update Channel",pri:"CRITICAL",st:"complete",what:"Confirm Microsoft 365 Apps for pilot users is on Current Channel or Monthly Enterprise Channel (build 1803 or later). Semi-Annual Enterprise Channel does not support in-app Copilot experiences.",impact:"Users on Semi-Annual will have a valid license assigned but no Copilot experience in any Office app. There is no error message  -  it simply does not appear.",how:"Admin Center → Apps → Microsoft 365 Apps → Update channel → verify pilot users are on Current or Monthly Enterprise. Validate per device via Intune compliance reports or Office Click-to-Run.",gcch:"Many government environments pin to Semi-Annual for stability. This must be validated per device before pilot launch. The macOS desktop app for M365 Copilot is not available in GCC High."},{id:"pre-11",title:"Data Readiness Assessment",pri:"CRITICAL",st:"complete",what:"Structured workshop to assess the current governance baseline before Copilot deployment: sharing settings, sensitivity labels, DLP policies, retention coverage, eDiscovery readiness, and SharePoint Advanced Management availability.",impact:"Establishes the full picture of gaps that must be addressed before safe deployment.",how:"COMPLETED. Key findings: zero SharePoint site sensitivity labels, DLP active across all workloads, Audit Log ON, retention policy does not cover Copilot location (critical gap), SAM now included with Copilot license, approximately 430 legacy document protection documents, 249 sites needing oversharing attention, 112 inactive sites.",gcch:"Workshop completed. All subsequent remediation is sequenced from these findings."}]},{id:"access",label:"Access Control",sub:"Security Groups & Policies",bg:"#4C1D95",acc:"#A78BFA",items:[{id:"ac-1",title:"Create Entra Security Groups",pri:"CRITICAL",st:"complete",what:"Three security groups required per the Technical Control Guide: M365 Copilot License Group, Copilot Chat Authorized Group, and Copilot Studio License Group.",impact:"All Conditional Access policies, Teams App policies, and Integrated Apps configurations depend on these groups being in place first.",how:"COMPLETED via 01_Create_M365_Copilot_Security_Groups.ps1. Verify at entra.microsoft.us → Groups.",gcch:"Entra admin portal for GCC High: entra.microsoft.us"},{id:"ac-2",title:"Conditional Access Policy  -  Enterprise Copilot Platform App",pri:"CRITICAL",st:"complete",what:"Create a Conditional Access policy targeting the Enterprise Copilot Platform application (app ID: fb8d773d-7ef8-4ec0-a117-179f88add510). This is the hardest access gate  -  it blocks at the authentication layer regardless of other settings. Must cover both licensed M365 Copilot and unlicensed Copilot Chat.",impact:"Without this policy, users outside authorized groups can access Copilot surfaces. This is the gate that actually holds when other controls are misconfigured.",how:"First create the service principal: New-MgServicePrincipal -AppId fb8d773d-7ef8-4ec0-a117-179f88add510. Then create the CA policy scoped to authorized groups. Test in report-only mode before switching to enforcement. For belt-and-suspenders: service plan disable can also be applied in PowerShell per user  -  enumerate GUIDs first with Get-MgSubscribedSku as they are tenant-specific.",gcch:"Test CA policy changes in report-only mode before enforcement. Policy propagation takes time  -  do not test immediately after creating."},{id:"ac-3",title:"Integrated Apps  -  Scope Both Copilot Entries",pri:"CRITICAL",st:"complete",what:"In the Microsoft 365 Admin Center, scope both Copilot app entries to authorized groups. There are two separate entries: 'Microsoft 365 Copilot' (the licensed experience) and 'Microsoft 365 Copilot Chat' (the unlicensed experience). Both must be scoped.",impact:"Scoping only one entry leaves the other open to all eligible users. This is the most common misconfiguration in Copilot deployments.",how:"admin.microsoft365.us → Settings → Integrated Apps → search for 'Copilot' → find both Microsoft 365 Copilot AND Microsoft 365 Copilot Chat → scope each to authorized groups.",gcch:"Verify two separate entries exist. The licensed and unlicensed experiences are different Integrated Apps entries."},{id:"ac-4",title:"Teams App Permission Policies  -  Block All, Allow Authorized Group",pri:"CRITICAL",st:"complete",what:"Three steps in Teams Admin Center: (1) Set the Global (org-wide default) Teams App Permission Policy to block Copilot and Copilot Studio for all users. (2) Create an M365_Copilot_Allowed permission policy that allows the Copilot and Copilot Studio apps. (3) Assign M365_Copilot_Allowed to the License Group and Chat Authorized Group. Additionally, create a Teams App Setup Policy that pins Copilot in the left rail and assign it to licensed users only.",impact:"Without the global block, any Teams user can access Copilot regardless of Conditional Access or Integrated Apps settings. This is the Teams-specific access gate.",how:"Teams Admin Center (admin.teams.microsoft.us) → App permission policies → Global policy → block Copilot apps. Create new policy M365_Copilot_Allowed → allow Copilot → assign to authorized groups. For pinning: App setup policies → new policy → pin Copilot → assign to License Group only.",gcch:"Teams Admin Center for GCC High: admin.teams.microsoft.us. Last-applied policy wins if a user is in multiple groups."},{id:"ac-7",title:"Copilot Chat Pinning  -  Do Not Pin",pri:"CRITICAL",st:"complete",what:"Controls whether Copilot Chat auto-pins itself in the navigation of Word, Excel, PowerPoint, and OneNote.",impact:"Suppresses the entry point but does not block access. Conditional Access and Integrated Apps are the actual security gates.",how:"COMPLETED  -  admin.microsoft365.us → Copilot → Settings → Pin Copilot Chat → Do not pin → Do not ask users.",gcch:"In GCC High, Copilot Chat is desktop-only for users without a Copilot add-on  -  the web app is not yet available."}]},{id:"unlicensed",label:"Unlicensed Copilot Chat",sub:"Stand-Up, Govern & Test",bg:"#7C2D12",acc:"#FB923C",items:[{id:"ul-1",title:"Web Grounding  -  Confirm and Document OFF",pri:"CRITICAL",st:"in-progress",what:"Verify and formally document that web grounding is OFF at the tenant level. When web grounding is enabled, Copilot may send query content or metadata to commercial Bing infrastructure, introducing potential data flow outside the GCC High boundary.",impact:"This is an authorization documentation requirement, not just a configuration check. The documented state is what the security officer and authorizing official will rely on.",how:"admin.microsoft365.us → Settings → Copilot settings → locate web grounding control → confirm OFF → take a screenshot showing the setting state, admin account, and date → file to authorization evidence folder.",gcch:"GCC High default is OFF by design. Do not enable without written security team approval and formal risk acceptance documentation."},{id:"ul-2",title:"Unlicensed Copilot Chat  -  Test Plan Execution",pri:"HIGH",st:"complete",what:"Execute the unlicensed Copilot Chat test plan to confirm the experience behaves as intended: no Work/Web toggle, no tenant data grounding, model responds only to what users type.",impact:"Confirms the intended experience and prevents assumptions about tenant data access being active for unlicensed users.",how:"Sign in as an unlicensed Chat Authorized user → confirm no Work/Web toggle → prompt 'summarize my recent emails' (should return nothing from tenant data) → prompt with pasted text (should summarize the provided text) → check Purview audit log (do not assume audit events are generated  -  validate and document what you observe).",gcch:"Treat unlicensed Copilot Chat as potentially outside the GCC High sovereignty boundary unless tenant-specific documentation confirms otherwise. Users must not enter sensitive or CUI data."},{id:"ul-3",title:"Unauthorized User Block Test",pri:"CRITICAL",st:"complete",what:"Verify that users who are NOT in any authorized group cannot access any Copilot surface.",impact:"Confirms all three access controls are working together: Conditional Access, Integrated Apps, and Teams policy.",how:"Sign in as a user with no group membership → test Teams left rail (no Copilot should appear) → test Microsoft 365 portal (no Copilot app) → attempt to navigate directly to office365.us/chat (should receive a Conditional Access block error). Test from both the Teams desktop app and a web browser.",gcch:"Conditional Access policy propagation takes time after changes. Wait before testing after any policy update."},{id:"ul-4",title:"User Communication  -  All Staff",pri:"HIGH",st:"not-started",what:"Brief all employees on what AI surfaces are now available, who has access, what the controls mean, and what they must and must not do.",impact:"An unbriefed user who discovers Copilot Chat independently may enter sensitive content without understanding the boundary implications. User awareness is a security control.",how:"Communication should cover: (1) what Copilot Chat is and is not, (2) who has authorized access and why, (3) web grounding is OFF and what that means for data handling, (4) users must not enter sensitive or CUI content without explicit policy authorization, (5) how to report unexpected behavior or concerns.",gcch:"Distinguish from consumer AI tools. Emphasize GCC High boundary protections and the difference between the enterprise and consumer experiences."},{id:"ul-5",title:"Deploy Purview Browser Extension in AVD Environment",pri:"HIGH",st:"not-started",what:"Deploy the Microsoft Purview browser extension for Microsoft Edge to all Azure Virtual Desktop session hosts. This extends Data Loss Prevention and sensitivity label enforcement to browser-based Copilot Chat sessions inside the virtual desktop environment.",impact:"Without the extension, users accessing Copilot Chat via Edge in an AVD session bypass Endpoint DLP enforcement  -  the Data Loss Prevention control boundary does not extend into the browser layer.",how:"Deploy via GCC High Intune as a force-installed extension: Device Configuration → Extensions policy → force-install extension ID echcggldkblnoonpioixfbomdpmohmjl to AVD device groups. Alternatively use Group Policy with Edge ADMX templates. After deployment, validate from inside an AVD session.",gcch:"Proxy and TLS inspection in the AVD network path can affect extension behavior. Test explicitly from inside an AVD session on the customer network  -  document observed behavior before citing as an active control."},{id:"ul-6",title:"Shadow AI Controls  -  Defender Policy and Network Enforcement",pri:"HIGH",st:"not-started",what:"Two-layer approach to governing non-Microsoft AI tools: (1) In Microsoft Defender for Cloud Apps, create a Cloud Discovery policy to enumerate and categorize generative AI services in use  -  sanctioned (Microsoft 365 Copilot), monitored, or blocked (consumer AI tools). (2) Work with the network team to block consumer AI service domains at the firewall or proxy level for domains not approved for organizational use.",impact:"Without these controls, staff are likely using consumer AI services with organizational content today. Network-level blocking is the most reliable control  -  application-layer policies can be worked around, network blocks cannot.",how:"Defender for Cloud Apps → Cloud Discovery → review AI app findings → create App Control policy → categorize tools. Common domains to block at network level: chat.openai.com, claude.ai, gemini.google.com. Validate that enterprise Microsoft 365 Copilot endpoints remain accessible  -  they are different from consumer Copilot endpoints.",gcch:"Defender for Cloud Apps is available in GCC High. Coordinate with the security operations team. Document the approved/blocked list for the authorization record. Ensure the block list distinguishes consumer Microsoft Copilot endpoints from enterprise M365 Copilot endpoints."},{id:"ul-8",title:"Change Request: Enable Unlicensed Copilot Chat  -  Full Deployment Procedure",pri:"CRITICAL",st:"not-started",what:"Document and execute the formal change request to enable unlicensed Copilot Chat for all authorized staff. Covers the complete procedure: who submits the request, who approves it, which security groups are modified, which admin settings are changed, required pre/post testing, and the rollback procedure.",impact:"Without a formal change procedure, enablement is undocumented. Authorization reviewers will look for evidence that this change went through an approved change management process.",how:"Change request checklist: (1) add authorized staff to the Copilot Chat Authorized security group, (2) confirm Integrated Apps scoping covers both Copilot Chat entries, (3) confirm Conditional Access policy covers the authorized group, (4) confirm web grounding is documented OFF, (5) confirm user communication was sent before go-live, (6) assign a rollback owner. Document each step with timestamps and approver names.",gcch:"File the completed change request package to the authorization evidence folder, including approval records, group membership screenshots, admin setting screenshots with timestamps, and post-go-live validation results."},{id:"ul-9",title:"Finalize CyberOps Data Loss Prevention Requirements  -  PII Flags and Exfiltration Controls",pri:"CRITICAL",st:"not-started",what:"Working session with the cybersecurity operations team to finalize Data Loss Prevention policy requirements specific to Copilot interactions: which sensitive data types should trigger policy violations, the enforcement action per type, how exfiltration via Copilot will be detected and alerted in Microsoft Sentinel, and what the incident response procedure is.",impact:"Without security operations-validated requirements, the Copilot DLP policy is incomplete from a cybersecurity standpoint. This is an active security control that the security operations team must own and monitor  -  not just a compliance configuration.",how:"Working session agenda: (1) sensitive information types to protect in Copilot context, (2) enforcement posture per type  -  audit, warn, or block, (3) alert routing for DLP violations to Microsoft Sentinel, (4) how Copilot exfiltration attempts will appear in the SIEM, (5) incident response playbook for Copilot-related data incidents.",gcch:"Coordinate with the security operations team who owns Microsoft Sentinel in the GCC High environment (Sentinel already has an Authorization to Operate). Route Copilot DLP violations to Sentinel via the Microsoft 365 connector for centralized monitoring."}]},{id:"sam",label:"SharePoint Governance",sub:"Remediation & Access Controls",bg:"#064E3B",acc:"#34D399",items:[{id:"sam-1",title:"Activate SharePoint Advanced Management",pri:"CRITICAL",st:"in-progress",what:"SharePoint Advanced Management is now included with the M365 Copilot license. Confirm the Advanced Management option is accessible in the SharePoint Admin Center. This unlocks the Content Management Assessment, Data Access Governance reports, and all site lifecycle features.",impact:"Without SharePoint Advanced Management active, none of the governance reports or oversharing remediation tools are available.",how:"Navigate to the GCC High SharePoint Admin Center: TENANT-admin.sharepoint.us → Advanced Management. If not visible, wait 24 hours for license propagation.",gcch:"GCC High SharePoint Admin Center URL: TENANT-admin.sharepoint.us (not .com). This is a common error."},{id:"sam-2",title:"Run Content Management Assessment and Export Reports",pri:"CRITICAL",st:"not-started",what:"Two steps: (1) Start the automated Content Management Assessment  -  a tenant-wide scan across inactive sites, ownerless sites, broken permission inheritance, Everyone Except External Users permissions, and overpermissive sharing links. Takes 2-72 hours. Run this first before any remediation. (2) Export the Data Access Governance Site Permissions Snapshot as a CSV  -  this sorts every site by total permissioned users with an Everyone Except External Users flag. This is your prioritized remediation list.",impact:"The assessment gives you the full governance baseline. The snapshot shows you exactly which sites pose the highest Copilot oversharing risk  -  highest permissioned sites at the top.",how:"SharePoint Admin Center → Advanced Management → Start Assessment. Also run: Site Permissions report and Sharing Links report. Wait for completion → export each report as CSV.",gcch:"Available in GCC High with the M365 Copilot license. Run before enabling Restricted SharePoint Search to establish your baseline."},{id:"sam-4",title:"Oversharing Remediation and External Sharing Review",pri:"CRITICAL",st:"not-started",what:"Two parallel workstreams: (1) Using the Data Access Governance snapshot, remove Everyone Except External Users permissions from sites in the pilot scope  -  start with the highest permissioned sites. Apply Restricted Content Discovery to sites you cannot immediately remediate. (2) Review tenant-level external sharing settings: sharing level (most GCC High customers run at Existing guests only or stricter), default link type, link expiration, and domain allow/block lists.",impact:"249 sites currently flagged for oversharing. These are what Copilot surfaces to users when asked about organizational content. External sharing settings determine the maximum exposure boundary.",how:"Use the Data Access Governance CSV to prioritize  -  filter for Everyone Except External Users = Yes and sort by total permissioned users. Remove Everyone Except External Users per site via SharePoint Admin Center or PowerShell. External sharing: TENANT-admin.sharepoint.us → Policies → Sharing → review all settings.",gcch:"Document any exceptions to Existing guests only sharing level with CAB approval. External sharing settings in GCC High may be more restricted than commercial defaults."},{id:"sam-6",title:"Site Access Reviews and Ownership Policy",pri:"HIGH",st:"not-started",what:"Two steps: (1) Send formal site Access Reviews to owners of the highest-risk sites identified in the Data Access Governance report  -  owners review and confirm or remove permissions. (2) Run the Site Ownership Policy to identify ownerless or single-owner sites and send notifications to assign ownership. Sites with no owner cannot receive Access Reviews and cannot be governed.",impact:"Scales governance across hundreds of sites by involving the people who know the content. Ownerless sites are a governance dead zone.",how:"Access Reviews: Data Access Governance report → select sites with valid owners → Send access review → 5-day deadline for Everyone Except External Users sites, 14 days for others. Site Ownership: SharePoint Admin Center → Advanced Management → Site lifecycle → Site ownership → run in simulation mode first.",gcch:"Run simulation mode before activating the Site Ownership Policy. Confirm site owner email addresses are current before sending reviews."},{id:"sam-8",title:"Enable Restricted SharePoint Search",pri:"CRITICAL",st:"in-progress",what:"PowerShell-only tenant control that limits Copilot and org-wide SharePoint Search to a curated allowed list of sites. Sites not on the allowed list are invisible to Copilot search-based discovery. IMPORTANT LIMITATION: Restricted SharePoint Search restricts the search discovery path only. Copilot also uses Microsoft Graph signals including user activity data  -  content from restricted sites that a user has recently interacted with may still surface depending on implementation and recency signals. For comprehensive control, pair Restricted SharePoint Search with Restricted Content Discovery on high-risk sites. Also note: Restricted SharePoint Search also restricts org-wide SharePoint Search, not just Copilot  -  communicate to users before enabling.",impact:"Primary deployment-phase safety mechanism. Limits Copilot's SharePoint reach to only what you have reviewed. Does NOT restrict OneDrive or Exchange  -  users' own email and files are always accessible to Copilot.",how:`Connect-SPOService -Url 'https://TENANT-admin.sharepoint.us'
Enable-SPORestrictedSearch
Add-SPOTenantRestrictedSearchAllowedList -SitesList @('https://TENANT.sharepoint.us/sites/SITENAME')

For sites where users have recent interaction history: also apply Restricted Content Discovery to remove those sites from the discovery surface.`,gcch:"PowerShell only  -  no UI available in GCC High. Admin URL: TENANT-admin.sharepoint.us. Temporary control  -  disable when tenant remediation is complete."},{id:"sam-9",title:"Restricted Content Discovery  -  High-Risk Sites",pri:"HIGH",st:"not-started",what:"Per-site control that removes a site from Copilot and SharePoint Search without changing the site's actual permissions. Users who already have direct access can still navigate to the site. Apply immediately to the highest-risk sites identified in the Data Access Governance report.",impact:"Fastest per-site emergency control. Addresses the Restricted SharePoint Search limitation for sites where users have recent interaction history  -  Restricted Content Discovery removes those sites from the discovery surface more comprehensively than Restricted SharePoint Search alone.",how:"SharePoint Admin Center → Active sites → select site → Settings → Restrict content discoverability → Enable. Note: index propagation can take up to a week for sites with more than 500,000 items.",gcch:"Available in GCC High via the SharePoint Admin Center. Validate that the setting is applying correctly by testing Copilot search from a user account that has access to the site."},{id:"sam-10",title:"Restricted Access Control  -  Critical Sites",pri:"HIGH",st:"not-started",what:"Per-site hard boundary that limits access to a named Entra security group  -  changes actual SharePoint permissions, not just discovery. Only members of the specified group can access the site at all, regardless of tool. For the most sensitive content: CUI, HR records, mission-critical data.",impact:"Strongest per-site control. Affects browser access, API access, and Copilot  -  not just discovery.",how:"CRITICAL: Create the Entra security group FIRST. If you enable Restricted Access Control without a group, the site locks with no access  -  including your own. SharePoint Admin Center → Active sites → site → Settings → Restricted access control → Enable → enter security group name.",gcch:"Permanent governance  -  not a temporary deployment workaround. For GCC High: available via SharePoint Admin Center. Validate that the assigned security group contains the correct members before enabling."},{id:"sam-14",title:"Site Lifecycle Management and Ongoing Governance",pri:"ONGOING",st:"not-started",what:"Two ongoing actions: (1) Configure the Inactive Sites policy to identify and address the 112 inactive sites  -  notify owners, archive non-responsive sites. Archived sites are excluded from Copilot grounding and preserved for eDiscovery. (2) Schedule monthly Data Access Governance report reviews on the 1st of each month  -  run Sharing Links Activity and Everyone Except External Users Activity reports and action all flags within 48 hours.",impact:"Without ongoing monitoring, remediation gains erode as users create new sharing and sites go stale. The inactive sites contain content Copilot can still surface.",how:"Site lifecycle: SharePoint Admin Center → Advanced Management → Site lifecycle → Inactive sites → Simulation mode first → 14-day response timeout → activate. For Teams-connected sites, archive the Team first via Teams Admin Center. Monthly monitoring: calendar reminder → run both Data Access Governance reports → action flags.",gcch:"Consider automating the monthly reporting step with the Governance Agent (Phase 11  -  Full Operations)."}]},{id:"purview",label:"Purview & Compliance",sub:"Labels, DLP, Retention",bg:"#78350F",acc:"#FCD34D",items:[{id:"pur-2",title:"Unified Audit Log  -  Active",pri:"CRITICAL",st:"complete",what:"Unified Audit Log must be enabled for CopilotInteraction events to be captured and available for eDiscovery.",impact:"Without audit logging, there is no record of what users asked Copilot or what data it retrieved and surfaced.",how:"CONFIRMED active. Validate CopilotInteraction events are being generated: compliance.microsoft.us → Audit → search 'Interacted with Copilot' for a date range with known pilot activity → confirm events appear with expected metadata.",gcch:"Purview compliance portal for GCC High: compliance.microsoft.us"},{id:"pur-4",title:"Retention Policy  -  Copilot and AI Apps Location",pri:"CRITICAL",st:"not-started",what:"Create a Purview retention policy that explicitly covers the 'Microsoft 365 Copilot and Copilot Chat' location. Retention policies created before Copilot was released  -  including policies covering Teams chats  -  do not automatically cover Copilot interactions. This location must be explicitly added in a separate policy.",impact:"Without this policy, Copilot prompt and response data has no governed retention period  -  an authorization gap with no workaround. This has no technical dependencies and can be completed immediately.",how:"compliance.microsoft.us → Solutions → Data Lifecycle Management → Retention Policies → New Policy → Locations: select 'Microsoft 365 Copilot and Copilot Chat' ONLY → set retention period per records management requirements → Submit. Must be a separate policy from Teams chats.",gcch:"Confirm the location name in your tenant  -  it may appear as 'Copilot and AI apps' depending on when the policy interface was last updated."},{id:"pur-5",title:"Data Loss Prevention Policy  -  Add Copilot as Protected Location",pri:"HIGH",st:"not-started",what:"Data Loss Prevention policies must explicitly include Microsoft 365 Copilot as a protected location. Existing policies covering Teams, SharePoint, Exchange, or OneDrive do NOT automatically cover Copilot. Enforcement behavior in GCC High must be tested and documented  -  do not assume parity with commercial environments.",impact:"Without this, sensitive content can be retrieved and surfaced by Copilot even if DLP would have blocked it through other channels.",how:"compliance.microsoft.us → Data Loss Prevention → Poli
