- Exclude high-value but inactive content from AI processing
- Reduce oversharing exposure without deleting content you cannot delete

This is an Azure Consumption-based service (excluded from M365 Copilot licensing). Factor into budget planning.`,verify:"admin.microsoft365.us \u2192 SharePoint Admin Center \u2192 Archive policies. Review pricing before deploying at scale.",gcch:"Validate GCCH availability via the Service Description. Archive is listed in the E3/E5 FastTrack workbook as an option for excluding inactive content from Copilot."},{id:"faq-21",category:"Availability",q:"What is Copilot Studio and how does it work in GCCH?",a:`Copilot Studio is a separate Microsoft product for building custom AI agents and chatbots. It is NOT part of the M365 Copilot license  -  it requires separate licensing.

In GCC High: Copilot Studio for US Government has been available since February 2022. However, only declarative agents created with the Microsoft 365 Agents Toolkit (pro-code path) are currently confirmed for GCCH. Agent Builder and low-code studio authoring are not yet confirmed.

Key differences from M365 Copilot:
- Copilot Studio agents have custom-defined data sources, not automatic Graph grounding
- Power Platform DLP governs what connectors agents can use
- Separate admin surface: Power Platform Admin Center
- Agents can be published to Teams, SharePoint, or the M365 Copilot surface
- Each agent is a change-managed event requiring its own governance review

For this deployment, Copilot Studio is a Phase 3 workstream  -  after the M365 Copilot pilot is stable.`,verify:"Power Platform Admin Center (GCCH equivalent URL) \u2192 confirm Copilot Studio licensing is assigned. Test creating a simple agent in a dev environment before production.",gcch:"Only pro-code declarative agents via M365 Agents Toolkit confirmed. Validate current low-code availability status before communicating to users."},{id:"faq-22",category:"Governance",q:"What is the Work/Web merge and 'automatic grounding'  -  should we be tracking this?",a:`Microsoft is evolving Copilot experiences toward more automatic grounding across tenant and web data sources. This may reduce reliance on explicit Work/Web mode toggles in the future. The exact control model, naming, and availability in GCC High should be validated as updates are released.

Why this matters for your deployment: the current security posture documented for authorization relies on web grounding being OFF as an admin-controlled setting. If Microsoft changes how grounding is controlled  -  moving from an explicit toggle to automatic routing  -  the mechanism for enforcing that boundary posture changes. Any change to how grounding is controlled must trigger a review of authorization assumptions, control documentation, and security team-approved boundary assertions.

Do not assert that the toggle will be removed, that a specific feature name is confirmed, or that any timeline applies to GCC High until validated in the tenant.`,verify:"Monitor: Microsoft 365 Message Center, Microsoft Public Sector Blog, Service Description updates. When a relevant change is announced: (1) validate behavior in GCC High tenant, (2) determine whether the admin control mechanism changes, (3) review authorization documentation and notify security team if controls are affected.",gcch:"Changes to commercial Copilot do not automatically apply to GCC High. Validate GCC High-specific behavior before updating any compliance documentation."},{id:"faq-23",category:"Licensing",q:"What does 'Enterprise Data Protection' on the Copilot shield mean? And from a security standpoint, what does the license buy us in GCC High?",a:`Two questions that deserve direct answers.

WHAT ENTERPRISE DATA PROTECTION ACTUALLY MEANS:
Enterprise Data Protection (EDP) ensures that prompts and responses are handled under Microsoft's enterprise security, privacy, and compliance terms  -  including encryption, isolation, and contractual data handling protections. This applies to both licensed and unlicensed Copilot Chat when signed in with a work account.

What EDP does NOT guarantee: that your tenant-specific controls are configured or effective. Sensitivity labels, Data Loss Prevention policies, retention policies, and conditional access rules only protect your environment if they are correctly configured. EDP does not configure them for you and does not verify they are active. EDP covers Microsoft's handling of your data. Your controls cover your environment's governance posture. These are separate concerns.

WHAT THE LICENSE BUYS FROM A SECURITY PERSPECTIVE:
The M365 Copilot license does not make your GCC High environment more secure. Your security controls make it secure. The license enables Copilot to operate on tenant data using Microsoft Graph. When that happens, your existing controls  -  permissions, sensitivity labels, Data Loss Prevention, retention, and audit  -  are applied to Copilot interactions.

Controls exist regardless of the license. But Copilot only interacts with and enforces them when operating on tenant data via Graph. Without the license, Copilot has no tenant data access, so your controls have nothing to govern in the context of Copilot behavior. With the license:
- Sensitivity labels and information barriers are respected
- Data Loss Prevention policies apply to Copilot's retrieval and surfacing of content
- Copilot audit events are generated  -  interactions become discoverable
- Retention policies apply when the Copilot and AI apps location is configured
- Data processing occurs under Microsoft Product Terms and Data Protection Addendum for M365

Copilot does not introduce new access. It amplifies existing permissions and data exposure patterns. If oversharing exists in the tenant, Copilot surfaces that exposure faster and more efficiently than a human could. This is why Restricted SharePoint Search, Restricted Content Discovery, and sensitivity labeling must precede broad deployment.

One common misconception worth addressing directly: when web grounding is ON, neither licensed nor unlicensed Copilot sends full tenant documents or Graph data to Bing. Both send only a short derived search query. The boundary interaction is the same class for both. Licensed Copilot is not more risky than unlicensed specifically because tenant data gets sent out  -  it does not. The real security difference lives in the web grounding OFF state: licensed accesses tenant data via Graph with your controls applied and everything stays within GCC High; unlicensed has no tenant data access at all.

Bottom line: the license is not a security control. It is what enables your security controls to be applied to Copilot behavior.`,verify:"Validate that CopilotInteraction audit events are generated for licensed users: run a Purview audit search after a test interaction. Confirm events appear with expected metadata. This confirms the audit trail that forms part of your authorization evidence.",gcch:"In GCC High, the licensed M365 Copilot path is designed to keep processing within the GCC High boundary in Work Mode with web grounding OFF. The unlicensed path has Enterprise Data Protection from Microsoft's side, but no tenant-specific compliance governance path  -  no audit events, no retention policy application, no Data Loss Prevention enforcement against Copilot behavior."},{id:"faq-25",category:"Licensing",q:"Is licensed M365 Copilot actually more risky than unlicensed Copilot Chat when web grounding is ON? Does tenant data get sent to Bing?",a:`No  -  and this is one of the most common misconceptions worth correcting directly.

WHAT ACTUALLY HAPPENS WHEN WEB GROUNDING IS ON:
Both licensed M365 Copilot and unlicensed Copilot Chat generate and send a short derived search query to Bing. Microsoft documentation explicitly confirms that full prompts, tenant documents, emails, and Microsoft Graph data are NOT sent to Bing. Only a minimal query derived from the prompt leaves the boundary.

THE RISK COMPARISON (web grounding ON):
- Unlicensed Copilot Chat: sends a derived query to Bing (based on what the user typed)
- Licensed M365 Copilot: sends a derived query to Bing (based on prompt + context)
- Both are the same class of boundary interaction
- Licensed is NOT more risky because tenant data is sent out  -  it is not
- Licensed operates under stronger contractual protections (DPA, no training on your data)

WHERE THE REAL DIFFERENCE LIVES (web grounding OFF):
- Unlicensed: no tenant data access at all. EDP applies but your compliance controls have nothing to govern in Copilot context.
- Licensed: full Graph grounding within GCC High boundary. Your DLP, sensitivity labels, retention, and audit all apply. This is the controlled, compliant path.

THE ENTERPRISE SHIELD:
The shield appears on both because Enterprise Data Protection (EDP) applies to both  -  meaning Microsoft handles the session under enterprise contractual terms (no training on your data, enterprise privacy terms, DPA). It does NOT mean GCC High boundary is enforced, web grounding is off, or your compliance controls are active.`,verify:"Review Microsoft's Enterprise Data Protection documentation at learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection for the authoritative statement on what is and is not sent to Bing.",gcch:"In GCC High, Bing is a commercial endpoint outside the sovereign boundary. Even though only a derived query is sent, that boundary crossing requires explicit security team approval and documented risk acceptance before enabling web grounding. Zero Query Logging (ZQL) is a related privacy control: when active, Bing routes the query to a no-logging index and does not retain the query, identifiers, or prompt signals after processing. ZQL is a retention control, not a boundary elimination - the approval requirement remains regardless of ZQL status."},{id:"faq-24",category:"Data Governance",q:"We applied RSS to restrict SharePoint sites but content from restricted sites is still surfacing in Copilot. Why?",a:`This is a documented limitation of Restricted SharePoint Search that every deployment team should understand.

RSS restricts Copilot's SharePoint SEARCH path  -  sites not on the allowed list are excluded from search-based discovery. However, Copilot uses Microsoft Graph for multiple signal types beyond search, including:

- Recently accessed files: Copilot uses Microsoft Graph signals beyond SharePoint search, including user activity data. Content from restricted sites that a user has recently interacted with may still surface depending on implementation and recency signals
- Recently received email attachments from restricted site content
- Recently engaged Teams content

RSS controls the search path. It does not retroactively remove items from a user's recent activity context in Microsoft Graph.

PRACTICAL IMPLICATION: RSS alone is insufficient if users have recently interacted with content from high-risk sites. The required combination is:
- RSS to limit new search-based discovery going forward
- RCD (Restricted Content Discovery) on high-risk sites  -  this removes the site from the discovery surface more comprehensively, not just from search
- RCA (Restricted Access Control) for the most sensitive content  -  this changes actual permissions, which affects the Graph activity path

The recent-activity signal typically fades after approximately 30 days of no access. For immediate control, apply RCD to sites where users have recent interaction history.`,verify:"After applying RSS, ask Copilot to surface content you know a user has recently accessed from a restricted site. If it still appears, confirm via Purview audit whether the interaction used the search path or the activity/Graph path. This will identify whether RCD is also required.",gcch:"Validate this behavior in your specific GCC High tenant. The interaction between RSS and the Graph activity feed should be tested and documented before citing RSS as a comprehensive control in authorization documentation."}],Tv=[{id:"act-1",title:"Validate Copilot interaction discoverability via Purview audit and eDiscovery",owner:"",due:"",status:"Resolved",notes:"VALIDATED. For licensed M365 Copilot: interactions are processed within the M365 service boundary and stored in the user's Exchange Online mailbox (hidden folder) - auditable via Purview and discoverable via eDiscovery. ATO-safe statement: 'Microsoft 365 Copilot interactions are processed within the Microsoft 365 service boundary and are auditable via Microsoft Purview. For licensed Copilot, prompt/response data is stored in Exchange Online and is discoverable via eDiscovery and audit logs.' For unlicensed Copilot Chat: limited content logging - audit visibility primarily via Entra and session metadata. Evidence paths to cite: Purview Audit (CopilotInteraction events), eDiscovery (Exchange Online mailbox content), Microsoft Learn enterprise data protection documentation."},{id:"act-2",title:"Confirm web grounding granularity in GCCH  -  per-group or tenant-wide only",owner:"",due:"",status:"Open",notes:"Web grounding is controlled via Microsoft 365 Cloud Policy, which supports scoped targeting in commercial environments. In GCCH, the availability and granularity of this control must be explicitly validated in the tenant before being relied upon or communicated to the ISSO. Until confirmed, treat as a tenant-level control."},{id:"act-3",title:"Validate Intelligent Recap with Copilot-only license (no Teams Premium)",owner:"",due:"",status:"Open",notes:"Run test meeting with Copilot-only licensed user. Check Recap tab. Document each feature as accessible or locked."},{id:"act-4",title:"Run SAM Content Management Assessment  -  establish baseline",owner:"",due:"",status:"Open",notes:"Start immediately  -  takes 2-72 hours. SharePoint Admin \u2192 Advanced Management \u2192 Start Assessment."},{id:"act-5",title:"Test Edge Purview add-in behavior in GCCH network environment",owner:"",due:"",status:"Open",notes:"Proxy/TLS config may affect behavior. Validate before citing as control in ATO documentation."},{id:"act-7",title:"Test DLP enforcement against Copilot  -  validate label-based condition blocks",owner:"",due:"",status:"Open",notes:"Known DLP gaps in GCCH Copilot. Test and document observed behavior. Do not assume coverage."},{id:"act-8",title:"Create Purview retention policy for Copilot and AI apps location",owner:"",due:"",status:"Open",notes:"This action has no technical dependencies and can be completed immediately. compliance.microsoft.us \u2192 Data Lifecycle \u2192 Retention Policies \u2192 New \u2192 Locations: Microsoft 365 Copilot and Copilot Chat ONLY  -  separate from Teams chats policy. Until this exists, Copilot interaction data has no governed retention  -  an ATO gap."},{id:"act-11",title:"Configure Power Platform DLP  -  Phase 3 (Copilot Studio) pre-production gate",owner:"",due:"",status:"Resolved",notes:"Not required for M365 Copilot pilot or rollout. Reclassified as a Phase 3 (Copilot Studio) pre-production gate  -  must be configured before any Copilot Studio agent goes to production. Power Platform DLP governs connector behavior for agents and is separate from Purview DLP. Configure in Power Platform Admin Center (GCCH equivalent URL)."},{id:"act-12",title:"Monitor Copilot grounding model changes  -  Work/Web convergence",owner:"",due:"",status:"Open",notes:"Microsoft is evolving Copilot experiences toward more automatic grounding across tenant and web data sources. This may reduce reliance on explicit Work/Web toggles. Monitor: Message Center, Microsoft Public Sector Blog, Service Description updates. Any change to how grounding is controlled must trigger a review of authorization assumptions, web grounding control documentation, and security officer-approved boundary assertions before updating documentation. Do not assume commercial announcements reflect GCC High availability or timeline."},{id:"act-steven",title:"Send Steven the known bugs list",owner:"",due:"",status:"Resolved",notes:"RESOLVED. Validated bugs list ready to send to Steven: (1) Enterprise Shield confusion - indicates EDP (enterprise data protection terms), NOT GCC High boundary enforcement and does not indicate whether web grounding is active or if data leaves GCC High. (2) Web grounding Bing routing - routes derived search queries only (not full prompts or tenant data) to commercial Bing endpoints when enabled; OFF by default in GCC High. (3) SharePoint / People Card inconsistencies - people card metadata and permissions not always aligned with Copilot retrieval experience; can surface perceived unexpected content based on underlying permissions. (4) Optional Connected Experiences dependency - certain Copilot capabilities silently degrade when this setting is disabled (common via FedRAMP hardening policies). (5) WebSocket / network reliability issues in AVD/VPN - impacts Copilot responsiveness and streaming; often tied to proxy inspection and TLS handling. (6) M365 Apps update channel dependency - Copilot features gated by update channel; Semi-Annual = missing capabilities. (7) DLP enforcement gaps in GCC High - known limitations in how label/DLP policies enforce in Copilot scenarios; must be tested, do not assume parity with Exchange/SharePoint enforcement."}],Dv=["Open","In Progress","Resolved","Blocked"],zv=["All","Access","Licensing","Governance","Data Governance","Compliance","SAM","Availability","Troubleshooting"],ro=[{id:"pre",label:"Pre-Deployment",sub:"Foundation",bg:"#1E3A5F",acc:"#60A5FA",items:[{id:"pre-1",title:"GCC High Tenant Verification",pri:"CRITICAL",st:"complete",what:"Confirm the tenant is genuine GCC High: all admin experiences should use .us domain endpoints (portal.office365.us, admin.microsoft365.us). The Microsoft 365 Admin Center should explicitly display GCC High as the cloud environment.",impact:"Running configuration or testing in the wrong environment invalidates all results and may expose data outside the GCC High boundary.",how:"Navigate to admin.microsoft365.us. Confirm the URL stays on a .us domain throughout. Admin Center \u2192 Settings \u2192 Org settings \u2192 cloud environment should read GCC High. Do not validate using .com surfaces.",gcch:"Authentication routes through login.microsoftonline.us. All GCC High admin portals use .us domains. Commercial .com portals show a different tenant."},{id:"pre-2",title:"Network, Transport Security & WebSocket Validation",pri:"CRITICAL",st:"complete",what:"Validate three things together from a pilot device on the corporate network: (1) Outbound HTTPS to *.office365.us and *.microsoftonline.us is allowed. (2) TLS inspection is NOT intercepting Microsoft 365 traffic. (3) WebSocket connections succeed for *.gov.cloud.microsoft and *.office.com. Run the official Microsoft 365 Copilot Network Connectivity Test to capture results as authorization evidence.",impact:"TLS inspection breaking Microsoft 365 connections is the most common Copilot authentication failure. WebSocket failures cause Copilot to hang silently even when HTTPS looks healthy. Both must be confirmed before licenses are assigned.",how:"From a pilot workstation: (1) confirm firewall allows *.office365.us and *.microsoftonline.us with TLS bypass. (2) Test WebSocket connectivity  -  if a proxy is in-path confirm it supports WebSockets. (3) Navigate to connectivity.m365.cloud.microsoft/copilot and run the official test. Save the results as a PDF for authorization evidence.",gcch:"GCC High endpoints must be excluded from TLS/SSL inspection appliances. WebSocket failures are a recurring GCC High Copilot deployment hard blocker. The connectivity test tool resolves against .us endpoints  -  run from the corporate network, not VPN unless VPN is the production path."},{id:"pre-2c",title:"M365 Apps, Connected Experiences & Outlook Client Check",pri:"CRITICAL",st:"complete",what:"Three checks in one pass for a licensed pilot user: (1) Confirm 'Allow connected experiences in Office' and 'Allow connected experiences that analyze content' are both enabled  -  both are required for Copilot in Word, Excel, PowerPoint, Outlook, and Teams. (2) Confirm Microsoft 365 Apps is on Current Channel or Monthly Enterprise Channel  -  Semi-Annual does not support Copilot. (3) Confirm the Outlook client is a supported version. If Copilot is missing in Outlook Classic, check whether the Microsoft People Cards service principal is disabled in Entra  -  this is a documented GCC High issue.",impact:"Disabling Connected Experiences via FedRAMP privacy hardening removes Copilot from all Office apps. Semi-Annual Channel is the most common silent deployment blocker in government environments. Both issues present as 'Copilot missing' with no obvious error.",how:"Review Cloud Policy or Group Policy for M365 Apps privacy settings. Validate the update channel in Microsoft 365 Apps admin or Intune. For Outlook Classic: sign in as a licensed pilot user and confirm Copilot appears in the ribbon. If not: entra.microsoft.us \u2192 Enterprise applications \u2192 search People Cards \u2192 confirm enabled.",gcch:"Check Connected Experiences and update channel BEFORE diagnosing licensing or pinning. FedRAMP-driven privacy hardening is the most common cause in government environments. People Cards SP issue has been confirmed across multiple GCC High tenants."},{id:"pre-3",title:"Multi-Factor Authentication via Conditional Access",pri:"CRITICAL",st:"complete",what:"Confirm MFA is enforced for all Copilot-bound users via Conditional Access policy. This is a prerequisite, not an enhancement.",impact:"A compromised account without MFA gives an attacker full access to everything Copilot can surface  -  email, files, Teams, SharePoint  -  via natural language query with no additional effort.",how:"entra.microsoft.us \u2192 Conditional Access \u2192 confirm MFA required for Microsoft 365 apps for all pilot users. Test sign-in from a pilot account to confirm MFA prompts.",gcch:"Entra admin portal for GCC High: entra.microsoft.us. Authentication endpoint: login.microsoftonline.us."},{id:"pre-4",title:"Licensing and Exchange Online Verification",pri:"CRITICAL",st:"complete",what:"Confirm two prerequisites for every pilot user: (1) M365 G3 or G5 Government base license is assigned  -  the Copilot add-on cannot activate without a qualifying base. (2) Primary mailbox is in Exchange Online  -  on-premises Exchange is not supported and breaks Copilot interaction storage and eDiscovery.",impact:"Add-on without qualifying base = silent failure. On-premises mailbox = no audit trail, no retention, no eDiscovery for Copilot interactions.",how:"Admin Center \u2192 Active Users \u2192 select each pilot user \u2192 verify G3/G5 Government license and Exchange Online as primary mailbox provider. For bulk validation: Get-EXOMailbox to confirm Exchange Online status for all pilot accounts.",gcch:"Government SKUs: M365 G3 or G5 Government. Not commercial E3/E5."},{id:"pre-5",title:"Microsoft 365 Apps Update Channel",pri:"CRITICAL",st:"complete",what:"Confirm Microsoft 365 Apps for pilot users is on Current Channel or Monthly Enterprise Channel (build 1803 or later). Semi-Annual Enterprise Channel does not support in-app Copilot experiences.",impact:"Users on Semi-Annual will have a valid license assigned but no Copilot experience in any Office app. There is no error message  -  it simply does not appear.",how:"Admin Center \u2192 Apps \u2192 Microsoft 365 Apps \u2192 Update channel \u2192 verify pilot users are on Current or Monthly Enterprise. Validate per device via Intune compliance reports or Office Click-to-Run.",gcch:"Many government environments pin to Semi-Annual for stability. This must be validated per device before pilot launch. The macOS desktop app for M365 Copilot is not available in GCC High."},{id:"pre-11",title:"Data Readiness Assessment",pri:"CRITICAL",st:"complete",what:"Structured workshop to assess the current governance baseline before Copilot deployment: sharing settings, sensitivity labels, DLP policies, retention coverage, eDiscovery readiness, and SharePoint Advanced Management availability.",impact:"Establishes the full picture of gaps that must be addressed before safe deployment.",how:"COMPLETED. Key findings: zero SharePoint site sensitivity labels, DLP active across all workloads, Audit Log ON, retention policy does not cover Copilot location (critical gap), SAM now included with Copilot license, approximately 430 legacy document protection documents, 249 sites needing oversharing attention, 112 inactive sites.",gcch:"Workshop completed. All subsequent remediation is sequenced from these findings."}]},{id:"access",label:"Access Control",sub:"Security Groups & Policies",bg:"#4C1D95",acc:"#A78BFA",items:[{id:"ac-1",title:"Create Entra Security Groups",pri:"CRITICAL",st:"complete",what:"Three security groups required per the Technical Control Guide: M365 Copilot License Group, Copilot Chat Authorized Group, and Copilot Studio License Group.",impact:"All Conditional Access policies, Teams App policies, and Integrated Apps configurations depend on these groups being in place first.",how:"COMPLETED via 01_Create_M365_Copilot_Security_Groups.ps1. Verify at entra.microsoft.us \u2192 Groups.",gcch:"Entra admin portal for GCC High: entra.microsoft.us"},{id:"ac-2",title:"Conditional Access Policy  -  Enterprise Copilot Platform App",pri:"CRITICAL",st:"complete",what:"Create a Conditional Access policy targeting the Enterprise Copilot Platform application (app ID: fb8d773d-7ef8-4ec0-a117-179f88add510). This is the hardest access gate  -  it blocks at the authentication layer regardless of other settings. Must cover both licensed M365 Copilot and unlicensed Copilot Chat.",impact:"Without this policy, users outside authorized groups can access Copilot surfaces. This is the gate that actually holds when other controls are misconfigured.",how:"First create the service principal: New-MgServicePrincipal -AppId fb8d773d-7ef8-4ec0-a117-179f88add510. Then create the CA policy scoped to authorized groups. Test in report-only mode before switching to enforcement. For belt-and-suspenders: service plan disable can also be applied in PowerShell per user  -  enumerate GUIDs first with Get-MgSubscribedSku as they are tenant-specific.",gcch:"Test CA policy changes in report-only mode before enforcement. Policy propagation takes time  -  do not test immediately after creating."},{id:"ac-3",title:"Integrated Apps  -  Scope Both Copilot Entries",pri:"CRITICAL",st:"complete",what:"In the Microsoft 365 Admin Center, scope both Copilot app entries to authorized groups. There are two separate entries: 'Microsoft 365 Copilot' (the licensed experience) and 'Microsoft 365 Copilot Chat' (the unlicensed experience). Both must be scoped.",impact:"Scoping only one entry leaves the other open to all eligible users. This is the most common misconfiguration in Copilot deployments.",how:"admin.microsoft365.us \u2192 Settings \u2192 Integrated Apps \u2192 search for 'Copilot' \u2192 find both Microsoft 365 Copilot AND Microsoft 365 Copilot Chat \u2192 scope each to authorized groups.",gcch:"Verify two separate entries exist. The licensed and unlicensed experiences are different Integrated Apps entries."},{id:"ac-4",title:"Teams App Permission Policies  -  Block All, Allow Authorized Group",pri:"CRITICAL",st:"complete",what:"Three steps in Teams Admin Center: (1) Set the Global (org-wide default) Teams App Permission Policy to block Copilot and Copilot Studio for all users. (2) Create an M365_Copilot_Allowed permission policy that allows the Copilot and Copilot Studio apps. (3) Assign M365_Copilot_Allowed to the License Group and Chat Authorized Group. Additionally, create a Teams App Setup Policy that pins Copilot in the left rail and assign it to licensed users only.",impact:"Without the global block, any Teams user can access Copilot regardless of Conditional Access or Integrated Apps settings. This is the Teams-specific access gate.",how:"Teams Admin Center (admin.teams.microsoft.us) \u2192 App permission policies \u2192 Global policy \u2192 block Copilot apps. Create new policy M365_Copilot_Allowed \u2192 allow Copilot \u2192 assign to authorized groups. For pinning: App setup policies \u2192 new policy \u2192 pin Copilot \u2192 assign to License Group only.",gcch:"Teams Admin Center for GCC High: admin.teams.microsoft.us. Last-applied policy wins if a user is in multiple groups."},{id:"ac-7",title:"Copilot Chat Pinning  -  Do Not Pin",pri:"CRITICAL",st:"complete",what:"Controls whether Copilot Chat auto-pins itself in the navigation of Word, Excel, PowerPoint, and OneNote.",impact:"Suppresses the entry point but does not block access. Conditional Access and Integrated Apps are the actual security gates.",how:"COMPLETED  -  admin.microsoft365.us \u2192 Copilot \u2192 Settings \u2192 Pin Copilot Chat \u2192 Do not pin \u2192 Do not ask users.",gcch:"In GCC High, Copilot Chat is desktop-only for users without a Copilot add-on  -  the web app is not yet available."}]},{id:"unlicensed",label:"Unlicensed Copilot Chat",sub:"Stand-Up, Govern & Test",bg:"#7C2D12",acc:"#FB923C",items:[{id:"ul-1",title:"Web Grounding  -  Confirm and Document OFF",pri:"CRITICAL",st:"in-progress",what:"Verify and formally document that web grounding is OFF at the tenant level. When web grounding is enabled, Copilot may send query content or metadata to commercial Bing infrastructure, introducing potential data flow outside the GCC High boundary.",impact:"This is an authorization documentation requirement, not just a configuration check. The documented state is what the security officer and authorizing official will rely on.",how:"admin.microsoft365.us \u2192 Settings \u2192 Copilot settings \u2192 locate web grounding control \u2192 confirm OFF \u2192 take a screenshot showing the setting state, admin account, and date \u2192 file to authorization evidence folder.",gcch:"GCC High default is OFF by design. Do not enable without written security team approval and formal risk acceptance documentation."},{id:"ul-2",title:"Unlicensed Copilot Chat  -  Test Plan Execution",pri:"HIGH",st:"complete",what:"Execute the unlicensed Copilot Chat test plan to confirm the experience behaves as intended: no Work/Web toggle, no tenant data grounding, model responds only to what users type.",impact:"Confirms the intended experience and prevents assumptions about tenant data access being active for unlicensed users.",how:"Sign in as an unlicensed Chat Authorized user \u2192 confirm no Work/Web toggle \u2192 prompt 'summarize my recent emails' (should return nothing from tenant data) \u2192 prompt with pasted text (should summarize the provided text) \u2192 check Purview audit log (do not assume audit events are generated  -  validate and document what you observe).",gcch:"Treat unlicensed Copilot Chat as potentially outside the GCC High sovereignty boundary unless tenant-specific documentation confirms otherwise. Users must not enter sensitive or CUI data."},{id:"ul-3",title:"Unauthorized User Block Test",pri:"CRITICAL",st:"complete",what:"Verify that users who are NOT in any authorized group cannot access any Copilot surface.",impact:"Confirms all three access controls are working together: Conditional Access, Integrated Apps, and Teams policy.",how:"Sign in as a user with no group membership \u2192 test Teams left rail (no Copilot should appear) \u2192 test Microsoft 365 portal (no Copilot app) \u2192 attempt to navigate directly to office365.us/chat (should receive a Conditional Access block error). Test from both the Teams desktop app and a web browser.",gcch:"Conditional Access policy propagation takes time after changes. Wait before testing after any policy update."},{id:"ul-4",title:"User Communication  -  All Staff",pri:"HIGH",st:"not-started",what:"Brief all employees on what AI surfaces are now available, who has access, what the controls mean, and what they must and must not do.",impact:"An unbriefed user who discovers Copilot Chat independently may enter sensitive content without understanding the boundary implications. User awareness is a security control.",how:"Communication should cover: (1) what Copilot Chat is and is not, (2) who has authorized access and why, (3) web grounding is OFF and what that means for data handling, (4) users must not enter sensitive or CUI content without explicit policy authorization, (5) how to report unexpected behavior or concerns.",gcch:"Distinguish from consumer AI tools. Emphasize GCC High boundary protections and the difference between the enterprise and consumer experiences."},{id:"ul-5",title:"Deploy Purview Browser Extension in AVD Environment",pri:"HIGH",st:"not-started",what:"Deploy the Microsoft Purview browser extension for Microsoft Edge to all Azure Virtual Desktop session hosts. This extends Data Loss Prevention and sensitivity label enforcement to browser-based Copilot Chat sessions inside the virtual desktop environment.",impact:"Without the extension, users accessing Copilot Chat via Edge in an AVD session bypass Endpoint DLP enforcement  -  the Data Loss Prevention control boundary does not extend into the browser layer.",how:"Deploy via GCC High Intune as a force-installed extension: Device Configuration \u2192 Extensions policy \u2192 force-install extension ID echcggldkblnoonpioixfbomdpmohmjl to AVD device groups. Alternatively use Group Policy with Edge ADMX templates. After deployment, validate from inside an AVD session.",gcch:"Proxy and TLS inspection in the AVD network path can affect extension behavior. Test explicitly from inside an AVD session on the customer network  -  document observed behavior before citing as an active control."},{id:"ul-6",title:"Shadow AI Controls  -  Defender Policy and Network Enforcement",pri:"HIGH",st:"not-started",what:"Two-layer approach to governing non-Microsoft AI tools: (1) In Microsoft Defender for Cloud Apps, create a Cloud Discovery policy to enumerate and categorize generative AI services in use  -  sanctioned (Microsoft 365 Copilot), monitored, or blocked (consumer AI tools). (2) Work with the network team to block consumer AI service domains at the firewall or proxy level for domains not approved for organizational use.",impact:"Without these controls, staff are likely using consumer AI services with organizational content today. Network-level blocking is the most reliable control  -  application-layer policies can be worked around, network blocks cannot.",how:"Defender for Cloud Apps \u2192 Cloud Discovery \u2192 review AI app findings \u2192 create App Control policy \u2192 categorize tools. Common domains to block at network level: chat.openai.com, claude.ai, gemini.google.com. Validate that enterprise Microsoft 365 Copilot endpoints remain accessible  -  they are different from consumer Copilot endpoints.",gcch:"Defender for Cloud Apps is available in GCC High. Coordinate with the security operations team. Document the approved/blocked list for the authorization record. Ensure the block list distinguishes consumer Microsoft Copilot endpoints from enterprise M365 Copilot endpoints."},{id:"ul-8",title:"Change Request: Enable Unlicensed Copilot Chat  -  Full Deployment Procedure",pri:"CRITICAL",st:"not-started",what:"Document and execute the formal change request to enable unlicensed Copilot Chat for all authorized staff. Covers the complete procedure: who submits the request, who approves it, which security groups are modified, which admin settings are changed, required pre/post testing, and the rollback procedure.",impact:"Without a formal change procedure, enablement is undocumented. Authorization reviewers will look for evidence that this change went through an approved change management process.",how:"Change request checklist: (1) add authorized staff to the Copilot Chat Authorized security group, (2) confirm Integrated Apps scoping covers both Copilot Chat entries, (3) confirm Conditional Access policy covers the authorized group, (4) confirm web grounding is documented OFF, (5) confirm user communication was sent before go-live, (6) assign a rollback owner. Document each step with timestamps and approver names.",gcch:"File the completed change request package to the authorization evidence folder, including approval records, group membership screenshots, admin setting screenshots with timestamps, and post-go-live validation results."},{id:"ul-9",title:"Finalize CyberOps Data Loss Prevention Requirements  -  PII Flags and Exfiltration Controls",pri:"CRITICAL",st:"not-started",what:"Working session with the cybersecurity operations team to finalize Data Loss Prevention policy requirements specific to Copilot interactions: which sensitive data types should trigger policy violations, the enforcement action per type, how exfiltration via Copilot will be detected and alerted in Microsoft Sentinel, and what the incident response procedure is.",impact:"Without security operations-validated requirements, the Copilot DLP policy is incomplete from a cybersecurity standpoint. This is an active security control that the security operations team must own and monitor  -  not just a compliance configuration.",how:"Working session agenda: (1) sensitive information types to protect in Copilot context, (2) enforcement posture per type  -  audit, warn, or block, (3) alert routing for DLP violations to Microsoft Sentinel, (4) how Copilot exfiltration attempts will appear in the SIEM, (5) incident response playbook for Copilot-related data incidents.",gcch:"Coordinate with the security operations team who owns Microsoft Sentinel in the GCC High environment (Sentinel already has an Authorization to Operate). Route Copilot DLP violations to Sentinel via the Microsoft 365 connector for centralized monitoring."}]},{id:"sam",label:"SharePoint Governance",sub:"Remediation & Access Controls",bg:"#064E3B",acc:"#34D399",items:[{id:"sam-1",title:"Activate SharePoint Advanced Management",pri:"CRITICAL",st:"in-progress",what:"SharePoint Advanced Management is now included with the M365 Copilot license. Confirm the Advanced Management option is accessible in the SharePoint Admin Center. This unlocks the Content Management Assessment, Data Access Governance reports, and all site lifecycle features.",impact:"Without SharePoint Advanced Management active, none of the governance reports or oversharing remediation tools are available.",how:"Navigate to the GCC High SharePoint Admin Center: TENANT-admin.sharepoint.us \u2192 Advanced Management. If not visible, wait 24 hours for license propagation.",gcch:"GCC High SharePoint Admin Center URL: TENANT-admin.sharepoint.us (not .com). This is a common error."},{id:"sam-2",title:"Run Content Management Assessment and Export Reports",pri:"CRITICAL",st:"not-started",what:"Two steps: (1) Start the automated Content Management Assessment  -  a tenant-wide scan across inactive sites, ownerless sites, broken permission inheritance, Everyone Except External Users permissions, and overpermissive sharing links. Takes 2-72 hours. Run this first before any remediation. (2) Export the Data Access Governance Site Permissions Snapshot as a CSV  -  this sorts every site by total permissioned users with an Everyone Except External Users flag. This is your prioritized remediation list.",impact:"The assessment gives you the full governance baseline. The snapshot shows you exactly which sites pose the highest Copilot oversharing risk  -  highest permissioned sites at the top.",how:"SharePoint Admin Center \u2192 Advanced Management \u2192 Start Assessment. Also run: Site Permissions report and Sharing Links report. Wait for completion \u2192 export each report as CSV.",gcch:"Available in GCC High with the M365 Copilot license. Run before enabling Restricted SharePoint Search to establish your baseline."},{id:"sam-4",title:"Oversharing Remediation and External Sharing Review",pri:"CRITICAL",st:"not-started",what:"Two parallel workstreams: (1) Using the Data Access Governance snapshot, remove Everyone Except External Users permissions from sites in the pilot scope  -  start with the highest permissioned sites. Apply Restricted Content Discovery to sites you cannot immediately remediate. (2) Review tenant-level external sharing settings: sharing level (most GCC High customers run at Existing guests only or stricter), default link type, link expiration, and domain allow/block lists.",impact:"249 sites currently flagged for oversharing. These are what Copilot surfaces to users when asked about organizational content. External sharing settings determine the maximum exposure boundary.",how:"Use the Data Access Governance CSV to prioritize  -  filter for Everyone Except External Users = Yes and sort by total permissioned users. Remove Everyone Except External Users per site via SharePoint Admin Center or PowerShell. External sharing: TENANT-admin.sharepoint.us \u2192 Policies \u2192 Sharing \u2192 review all settings.",gcch:"Document any exceptions to Existing guests only sharing level with CAB approval. External sharing settings in GCC High may be more restricted than commercial defaults."},{id:"sam-6",title:"Site Access Reviews and Ownership Policy",pri:"HIGH",st:"not-started",what:"Two steps: (1) Send formal site Access Reviews to owners of the highest-risk sites identified in the Data Access Governance report  -  owners review and confirm or remove permissions. (2) Run the Site Ownership Policy to identify ownerless or single-owner sites and send notifications to assign ownership. Sites with no owner cannot receive Access Reviews and cannot be governed.",impact:"Scales governance across hundreds of sites by involving the people who know the content. Ownerless sites are a governance dead zone.",how:"Access Reviews: Data Access Governance report \u2192 select sites with valid owners \u2192 Send access review \u2192 5-day deadline for Everyone Except External Users sites, 14 days for others. Site Ownership: SharePoint Admin Center \u2192 Advanced Management \u2192 Site lifecycle \u2192 Site ownership \u2192 run in simulation mode first.",gcch:"Run simulation mode before activating the Site Ownership Policy. Confirm site owner email addresses are current before sending reviews."},{id:"sam-8",title:"Enable Restricted SharePoint Search",pri:"CRITICAL",st:"in-progress",what:"PowerShell-only tenant control that limits Copilot and org-wide SharePoint Search to a curated allowed list of sites. Sites not on the allowed list are invisible to Copilot search-based discovery. IMPORTANT LIMITATION: Restricted SharePoint Search restricts the search discovery path only. Copilot also uses Microsoft Graph signals including user activity data  -  content from restricted sites that a user has recently interacted with may still surface depending on implementation and recency signals. For comprehensive control, pair Restricted SharePoint Search with Restricted Content Discovery on high-risk sites. Also note: Restricted SharePoint Search also restricts org-wide SharePoint Search, not just Copilot  -  communicate to users before enabling.",impact:"Primary deployment-phase safety mechanism. Limits Copilot's SharePoint reach to only what you have reviewed. Does NOT restrict OneDrive or Exchange  -  users' own email and files are always accessible to Copilot.",how:`Connect-SPOService -Url 'https://TENANT-admin.sharepoint.us'
Enable-SPORestrictedSearch
Add-SPOTenantRestrictedSearchAllowedList -SitesList @('https://TENANT.sharepoint.us/sites/SITENAME')

For sites where users have recent interaction history: also apply Restricted Content Discovery to remove those sites from the discovery surface.`,gcch:"PowerShell only  -  no UI available in GCC High. Admin URL: TENANT-admin.sharepoint.us. Temporary control  -  disable when tenant remediation is complete."},{id:"sam-9",title:"Restricted Content Discovery  -  High-Risk Sites",pri:"HIGH",st:"not-started",what:"Per-site control that removes a site from Copilot and SharePoint Search without changing the site's actual permissions. Users who already have direct access can still navigate to the site. Apply immediately to the highest-risk sites identified in the Data Access Governance report.",impact:"Fastest per-site emergency control. Addresses the Restricted SharePoint Search limitation for sites where users have recent interaction history  -  Restricted Content Discovery removes those sites from the discovery surface more comprehensively than Restricted SharePoint Search alone.",how:"SharePoint Admin Center \u2192 Active sites \u2192 select site \u2192 Settings \u2192 Restrict content discoverability \u2192 Enable. Note: index propagation can take up to a week for sites with more than 500,000 items.",gcch:"Available in GCC High via the SharePoint Admin Center. Validate that the setting is applying correctly by testing Copilot search from a user account that has access to the site."},{id:"sam-10",title:"Restricted Access Control  -  Critical Sites",pri:"HIGH",st:"not-started",what:"Per-site hard boundary that limits access to a named Entra security group  -  changes actual SharePoint permissions, not just discovery. Only members of the specified group can access the site at all, regardless of tool. For the most sensitive content: CUI, HR records, mission-critical data.",impact:"Strongest per-site control. Affects browser access, API access, and Copilot  -  not just discovery.",how:"CRITICAL: Create the Entra security group FIRST. If you enable Restricted Access Control without a group, the site locks with no access  -  including your own. SharePoint Admin Center \u2192 Active sites \u2192 site \u2192 Settings \u2192 Restricted access control \u2192 Enable \u2192 enter security group name.",gcch:"Permanent governance  -  not a temporary deployment workaround. For GCC High: available via SharePoint Admin Center. Validate that the assigned security group contains the correct members before enabling."},{id:"sam-14",title:"Site Lifecycle Management and Ongoing Governance",pri:"ONGOING",st:"not-started",what:"Two ongoing actions: (1) Configure the Inactive Sites policy to identify and address the 112 inactive sites  -  notify owners, archive non-responsive sites. Archived sites are excluded from Copilot grounding and preserved for eDiscovery. (2) Schedule monthly Data Access Governance report reviews on the 1st of each month  -  run Sharing Links Activity and Everyone Except External Users Activity reports and action all flags within 48 hours.",impact:"Without ongoing monitoring, remediation gains erode as users create new sharing and sites go stale. The inactive sites contain content Copilot can still surface.",how:"Site lifecycle: SharePoint Admin Center \u2192 Advanced Management \u2192 Site lifecycle \u2192 Inactive sites \u2192 Simulation mode first \u2192 14-day response timeout \u2192 activate. For Teams-connected sites, archive the Team first via Teams Admin Center. Monthly monitoring: calendar reminder \u2192 run both Data Access Governance reports \u2192 action flags.",gcch:"Consider automating the monthly reporting step with the Governance Agent (Phase 11  -  Full Operations)."}]},{id:"purview",label:"Purview & Compliance",sub:"Labels, DLP, Retention",bg:"#78350F",acc:"#FCD34D",items:[{id:"pur-2",title:"Unified Audit Log  -  Active",pri:"CRITICAL",st:"complete",what:"Unified Audit Log must be enabled for CopilotInteraction events to be captured and available for eDiscovery.",impact:"Without audit logging, there is no record of what users asked Copilot or what data it retrieved and surfaced.",how:"CONFIRMED active. Validate CopilotInteraction events are being generated: compliance.microsoft.us \u2192 Audit \u2192 search 'Interacted with Copilot' for a date range with known pilot activity \u2192 confirm events appear with expected metadata.",gcch:"Purview compliance portal for GCC High: compliance.microsoft.us"},{id:"pur-4",title:"Retention Policy  -  Copilot and AI Apps Location",pri:"CRITICAL",st:"not-started",what:"Create a Purview retention policy that explicitly covers the 'Microsoft 365 Copilot and Copilot Chat' location. Retention policies created before Copilot was released  -  including policies covering Teams chats  -  do not automatically cover Copilot interactions. This location must be explicitly added in a separate policy.",impact:"Without this policy, Copilot prompt and response data has no governed retention period  -  an authorization gap with no workaround. This has no technical dependencies and can be completed immediately.",how:"compliance.microsoft.us \u2192 Solutions \u2192 Data Lifecycle Management \u2192 Retention Policies \u2192 New Policy \u2192 Locations: select 'Microsoft 365 Copilot and Copilot Chat' ONLY \u2192 set retention period per records management requirements \u2192 Submit. Must be a separate policy from Teams chats.",gcch:"Confirm the location name in your tenant  -  it may appear as 'Copilot and AI apps' depending on when the policy interface was last updated."},{id:"pur-5",title:"Data Loss Prevention Policy  -  Add Copilot as Protected Location",pri:"HIGH",st:"not-started",what:"Data Loss Prevention policies must explicitly include Microsoft 365 Copilot as a protected location. Existing policies covering Teams, SharePoint, Exchange, or OneDrive do NOT automatically cover Copilot. Enforcement behavior in GCC High must be tested and documented  -  do not assume parity with commercial environments.",impact:"Without this, sensitive content can be retrieved and surfaced by Copilot even if DLP would have blocked it through other channels.",how:"compliance.microsoft.us \u2192 Data Loss Prevention \u2192 Policies \u2192 New \u2192 Locations \u2192 add Microsoft 365 Copilot \u2192 Rules: use label-based conditions (SIT-based prompt DLP not confirmed in GCC High) \u2192 set enforcement action \u2192 enable in test mode first \u2192 document what was tested and observed before switching to enforcement.",gcch:"Test DLP enforcement explicitly in the GCC High tenant. Known enforcement gaps exist. Document observed behavior and report findings to the security officer."},{id:"pur-6",title:"Sensitivity Labels  -  SharePoint Sites and Teams",pri:"CRITICAL",st:"not-started",what:"Apply sensitivity labels to SharePoint sites, Microsoft 365 Groups, and Teams. Currently zero site-level labels in this tenant. Without site labels, DLP cannot enforce label-based conditions and Copilot cannot inherit content classifications. Every site going onto the Restricted SharePoint Search allowed list must be labeled before being added.",impact:"Site sensitivity labels are the foundation for everything downstream: DLP enforcement, label inheritance, governance reporting, and Copilot classification awareness. Zero labels means zero DLP label coverage for Copilot.",how:"compliance.microsoft.us \u2192 Information Protection \u2192 enable sensitivity labels for SharePoint sites and groups \u2192 create label hierarchy (Public, Internal, Confidential minimum) \u2192 apply to highest-risk and pilot sites first \u2192 configure a default label policy for new sites. Enable Teams labels as well.",gcch:"Start with the 5-10 sites going on the Restricted SharePoint Search pilot allowed list. Label before adding to the list."},{id:"pur-8",title:"Default Label Policy  -  Baseline Label for Unlabeled Content",pri:"HIGH",st:"not-started",what:"Configure a default label policy that applies a designated baseline label to all content that has not been explicitly labeled. This makes unlabeled content visible to DLP policy enforcement, including when that content is attached to or referenced in a Copilot prompt.",impact:"With a baseline default label in place, DLP policies can treat unlabeled content as a distinct class  -  restricting unlabeled files referenced in Copilot interactions. Without this, unlabeled content is invisible to label-based DLP conditions.",how:"compliance.microsoft.us \u2192 Information Protection \u2192 Label policies \u2192 create or update the default label policy \u2192 assign a baseline label (e.g., 'Unclassified  -  Pending Review') as the default for SharePoint, OneDrive, and Exchange \u2192 write a DLP rule targeting this label in Copilot interactions \u2192 set enforcement to audit first, then warn or block after validation.",gcch:"Operationally pragmatic for environments where full content classification is not yet feasible. Default label plus DLP provides governance coverage over unlabeled content while classification is phased in."},{id:"pur-10",title:"Legacy Document Protection  -  Inventory and Migration",pri:"HIGH",st:"not-started",what:"Approximately 430 documents are protected with legacy Information Rights Management encryption. These documents are invisible to Copilot  -  it cannot read or surface them. Users asking Copilot about content in these documents will get nothing back.",impact:"Legacy document protection is a silent content gap that undermines user confidence in Copilot. Until these documents are migrated to Purview sensitivity labels, they remain inaccessible to AI grounding.",how:"Use Purview Content Explorer and PowerShell to inventory legacy protected documents \u2192 prioritize by usage frequency and mission relevance \u2192 migrate to Purview sensitivity labels \u2192 validate Copilot can access post-migration.",gcch:"Legacy Information Rights Management encryption is not recognized by Copilot. Only Purview sensitivity label encryption is supported for Copilot grounding."},{id:"pur-12",title:"eDiscovery and Content Search Readiness",pri:"HIGH",st:"not-started",what:"Confirm Copilot interaction data is discoverable via Purview audit and eDiscovery. Use the CopilotInteraction activity type as the filter. Document the results  -  these are your authorization evidence, not assumptions about storage services.",impact:"Required for compliance and forensic readiness. Observable eDiscovery results are the defensible evidence path for authorization documentation.",how:"compliance.microsoft.us \u2192 eDiscovery \u2192 create a test case \u2192 run a Content Search filtered by CopilotInteraction activity from a known pilot user \u2192 confirm results appear correctly \u2192 document findings and file to authorization evidence folder.",gcch:"Cite observable controls as authorization evidence: audit log events, eDiscovery results, retention policy configuration. Do not assert storage implementation details."},{id:"pur-14",title:"Communication Compliance  -  Copilot Coverage",pri:"HIGH",st:"in-progress",what:"Verify that Communication Compliance policies explicitly cover Copilot interactions. Use the 'Detect Microsoft Copilot interactions' policy template. Evaluate for AI-generated content violations, policy language, and code-of-conduct concerns.",impact:"Without explicit Copilot coverage in Communication Compliance, policy-violating interactions may go undetected.",how:"compliance.microsoft.us \u2192 Communication Compliance \u2192 review existing policies \u2192 confirm Copilot interactions are in scope \u2192 apply the Detect Microsoft Copilot interactions template \u2192 tune thresholds.",gcch:"Communication Compliance is available in GCC High with most core features. Verify the Copilot-specific template is available in your tenant."}]},{id:"monitoring",label:"Monitoring & Signals",sub:"Ongoing Oversight",bg:"#92400E",acc:"#FBBF24",items:[{id:"mon-1",title:"Data Security Posture Management for AI  -  Setup and Risk Assessments",pri:"HIGH",st:"not-started",what:"Two steps: (1) Complete the DSPM for AI onboarding checklist in Purview: confirm Audit is on, install the Purview compliance browser extension, onboard devices via Defender for Endpoint, apply the one-click recommended policies. (2) Configure data risk assessments for pilot SharePoint sites to identify oversharing exposure specific to Copilot.",impact:"DSPM for AI provides the AI-specific security posture dashboard with automatic recommendations. The data risk assessments score each site's Copilot exposure risk. Both require E5/G5 licensing.",how:"compliance.microsoft.us \u2192 DSPM for AI \u2192 Get Started checklist \u2192 apply one-click policies \u2192 Activity Explorer for AI signals \u2192 Data risk assessments \u2192 configure pilot sites (up to 10 sites, 200,000 items per location). Note: OneDrive item-level scanning is NOT currently supported  -  use Data Access Governance reports for OneDrive.",gcch:"Available in GCC High with one limitation: Browse to URL policies cannot be created  -  only Microsoft-supported AI sites are surfaced. Validate E5/G5 licensing before configuration."},{id:"mon-3",title:"Insider Risk Management  -  Risky AI Usage Policy",pri:"HIGH",st:"not-started",what:"Configure an Insider Risk Management policy using the risky AI usage template to detect potentially risky Copilot behavior patterns across the organization.",impact:"Behavioral security monitoring for Copilot. Catches abuse and anomalous usage patterns that DLP policies and audit log reviews alone miss.",how:"compliance.microsoft.us \u2192 Insider Risk Management \u2192 Policies \u2192 New \u2192 Risky AI usage template \u2192 tune detection thresholds against pilot cohort activity before broad enforcement.",gcch:"Core Insider Risk Management features are generally available in GCC High. Some advanced policy templates may be in Preview  -  verify the risky AI usage template is available in your tenant against the GCC High Purview feature matrix."},{id:"mon-4",title:"Defender for Cloud Apps  -  Shadow AI Discovery",pri:"MEDIUM",st:"not-started",what:"Review Microsoft Defender for Cloud Apps Cloud Discovery findings to identify non-Microsoft generative AI services in active use across the organization. Apply ongoing monitoring policies for sanctioned, tolerated, and blocked AI tools. This is the monitoring complement to the Shadow AI Controls setup task in the Unlicensed Chat phase.",impact:"Provides ongoing visibility into shadow AI usage after the initial block policies are in place. New services emerge continuously.",how:"Defender for Cloud Apps \u2192 Cloud Discovery \u2192 review AI app category findings monthly \u2192 update App Control policies as new tools emerge \u2192 coordinate with security operations team for enforcement actions.",gcch:"Available in GCC High. Coordinate with the security operations team. Shadow AI findings should feed into the risk register and be reviewed quarterly."},{id:"mon-6",title:"Quarterly Audit Log Review",pri:"ONGOING",st:"not-started",what:"Quarterly review of Copilot audit logs for anomalous usage patterns, unexpected data access, and potential policy violations. Required for continuous authorization monitoring.",impact:"Required evidence for authorization continuous monitoring. Demonstrates active oversight of Copilot behavior in the tenant.",how:"compliance.microsoft.us \u2192 Audit \u2192 CopilotInteraction activity for the previous quarter \u2192 review for anomalous patterns \u2192 document findings \u2192 file to authorization evidence folder. Export the results for the security officer's quarterly review.",gcch:"File quarterly review results to the authorization evidence folder. Maintain a log of findings and remediation actions taken."}]},{id:"entra",label:"Entra ID Governance",sub:"Access Reviews & Lifecycle",bg:"#1E3A5F",acc:"#38BDF8",items:[{id:"ent-1",title:"Configure Quarterly Access Reviews  -  Guests, Privileged Roles, and Groups",pri:"HIGH",st:"not-started",what:"Three access reviews configured in the same admin session: (1) B2B guest users with access to Microsoft 365 Groups, Teams, or SharePoint sites in pilot scope  -  auto-revoke on no response. (2) All Entra roles with material privilege: Global Admin, SharePoint Admin, Exchange Admin, Compliance Admin, Security Admin  -  pair with Privileged Identity Management just-in-time activation. (3) Microsoft 365 Groups and Teams that own SharePoint sites in pilot scope  -  site owners as reviewers.",impact:"Unreviewed guest access and stale group memberships are two of the most common sources of Copilot oversharing risk. Privileged accounts with Copilot access can surface significantly more data than standard users.",how:"Entra Identity Governance \u2192 Access Reviews \u2192 Create \u2192 configure one review for each category with a quarterly cadence. For guest reviews: auto-revoke non-responders. For privileged role reviews: pair with Privileged Identity Management just-in-time activation. For group reviews: assign site owners as reviewers.",gcch:"GCC High customers often operate at Existing guests only sharing level  -  verify alignment between SharePoint sharing settings and Entra B2B configuration. Privileged Identity Management available in GCC High  -  verify advanced features against service description."},{id:"ent-4",title:"Access Reviews  -  Applications and Service Principals",pri:"HIGH",st:"not-started",what:"Identify applications and service principals with access to Microsoft Graph or SharePoint that could surface content in Copilot agents or connectors. Review consented permissions and remove stale or overpermissioned service principals.",impact:"Critical as Copilot agents and connectors are introduced. Each registered application with Graph access is a potential data exposure path for Copilot behavior.",how:"Entra \u2192 App registrations + Enterprise applications \u2192 review all apps with SharePoint or Graph permissions \u2192 run access reviews on application assignments \u2192 identify and remove stale service principals \u2192 document current application permission state.",gcch:"Critical before onboarding any Copilot agents. Each agent registration creates a new service principal that must be included in future access reviews."},{id:"ent-5",title:"Lifecycle Workflows  -  Employee Onboarding, Transfer, and Offboarding",pri:"HIGH",st:"not-started",what:"Configure or validate Entra ID Governance Lifecycle Workflows for three employee events: joiners (new hires receive correct group memberships and licenses), movers (internal transfers get updated access), and leavers (departing employees lose Copilot license and group memberships within the target SLA).",impact:"A departing employee who retains a Copilot license retains Microsoft Graph access to tenant data until manually revoked. In a licensed Copilot deployment, this is a data exposure risk that grows with organizational turnover.",how:"Entra Identity Governance \u2192 Lifecycle workflows \u2192 configure joiner, mover, and leaver workflows \u2192 integrate with HR system signals where available \u2192 document the deprovisioning evidence loop.",gcch:"Document the deprovisioning timeline and process for authorization purposes. Federal customers should target same-day revocation for leavers."},{id:"ent-6",title:"Conditional Access  -  Validate Copilot Sign-Ins",pri:"HIGH",st:"not-started",what:"Use the Conditional Access What If tool to confirm that Copilot-related sign-ins trigger the correct policy evaluations: device compliance enforcement, multi-factor authentication, sign-in risk assessment.",impact:"Copilot must not create an expanded data access and discovery surface by bypassing existing Conditional Access controls.",how:"entra.microsoft.us \u2192 Conditional Access \u2192 What If tool \u2192 test with a representative pilot user identity \u2192 verify the correct CA policy evaluates \u2192 test from a non-compliant device (should be blocked) \u2192 document results.",gcch:"Test Conditional Access changes in report-only mode before enforcement to avoid breaking the pilot cohort."}]},{id:"adminconfig",label:"Admin Config Settings",sub:"Key Control Decisions",bg:"#0F4C81",acc:"#7DD3FC",items:[{id:"cfg-1",title:"Copilot Chat Pinning  -  Do Not Pin",pri:"CRITICAL",st:"complete",what:"Controls whether Copilot Chat auto-pins in the navigation of Word, Excel, PowerPoint, and OneNote.",impact:"Suppresses the entry point but does not block access. Conditional Access and Integrated Apps are the actual security gates.",how:"COMPLETED  -  admin.microsoft365.us \u2192 Copilot \u2192 Settings \u2192 Pin Copilot Chat \u2192 Do not pin \u2192 Do not ask users.",gcch:"In GCC High, Copilot Chat is desktop-only for unlicensed users  -  the web app surface is not yet available."},{id:"cfg-2",title:"Web Grounding (Cloud Policy)  -  Confirmed OFF and Documented",pri:"CRITICAL",st:"complete",what:"Web grounding is OFF by default in GCC High. This setting must be explicitly confirmed, screenshot, and filed as authorization evidence  -  default state does not substitute for documented evidence. When enabled, web grounding may send query content or metadata to commercial Bing infrastructure outside the GCC High boundary.",impact:"This documented setting is a core authorization control assertion. Any future change to how this is controlled  -  including potential evolution toward automatic grounding  -  must trigger a review of authorization assumptions.",how:"admin.microsoft365.us \u2192 Copilot \u2192 Settings \u2192 web grounding / web search control \u2192 confirm OFF \u2192 screenshot showing setting, admin account, and date \u2192 file to authorization evidence folder.",gcch:"Do not enable without written security team approval and formal risk acceptance. Per-group scoping via Cloud Policy may be possible  -  validate in tenant before communicating to the security officer as an option."},{id:"cfg-4",title:"Agents Governance Policy  -  Publish Before Enabling",pri:"CRITICAL",st:"not-started",what:"Before the Agents admin setting is enabled for any user, publish a formal agent governance policy defining who can create agents, what data sources they are permitted to access, the review and approval process before an agent goes to production, and the monitoring requirements.",impact:"Without governance, any licensed user can create a declarative agent that accesses tenant data with no oversight. In GCC High, no group-level creation controls currently exist  -  policy is the only mechanism.",how:"Draft agent governance policy \u2192 review with security and compliance teams \u2192 publish to SharePoint \u2192 confirm all licensed users have been notified. Policy must cover: creator authorization, permitted data sources, approval workflow, monitoring requirements, and decommissioning process. Then: admin.microsoft365.us \u2192 Settings \u2192 Agents \u2192 configure per policy.",gcch:"Only declarative agents via M365 Agents Toolkit (pro-code path) are currently confirmed in GCC High. Agent Builder and low-code Copilot Studio authoring not yet confirmed. Do not communicate those capabilities as available until validated in your tenant."},{id:"cfg-10",title:"Graph Connectors  -  Governance and Enablement Policy",pri:"HIGH",st:"not-started",what:"Microsoft Graph connectors enable ingestion of line-of-business data into Microsoft Graph for Copilot grounding. In GCC High, external connections and third-party connectors are NOT enabled by default. Each connector enablement brings a new data source into Copilot's grounding surface.",impact:"Each connector is a change-managed event  -  a new data source that Copilot can search and surface. Security and privacy review required before any connector is enabled.",how:"admin.microsoft365.us \u2192 Settings \u2192 Connectors \u2192 review available connectors \u2192 define the governance process: Privacy/Security review, data classification, CAB approval, ongoing monitoring. Enable only after completing this process.",gcch:"Connectors are not enabled by default in GCC High. Treat each as a change-managed event with formal review. Document each enabled connector in the authorization record."}]},{id:"pilotprep",label:"Pilot Preparation",sub:"Before First License",bg:"#1E3A5F",acc:"#60A5FA",items:[{id:"pp-2",title:"Build Restricted SharePoint Search Allowed List  -  5 to 10 Clean Sites",pri:"CRITICAL",st:"not-started",what:"Build the initial Restricted SharePoint Search allowed list with 5-10 sites that have been reviewed and cleared. Each site must meet readiness criteria before being added. Separately confirm and document that web grounding is OFF for licensed users.",impact:"The allowed list is the aperture. Everything not on this list is invisible to Copilot. This determines exactly what the pilot can access.",how:"For each candidate site: confirm not in Everyone Except External Users report + sensitivity label applied + site owner confirmed and active + no broken permission inheritance. Add cleared sites: Add-SPOTenantRestrictedSearchAllowedList -SitesList @('https://TENANT.sharepoint.us/sites/SITENAME'). Document each site added with date and approval.",gcch:"PowerShell only in GCC High. Admin URL: TENANT-admin.sharepoint.us"},{id:"pp-3",title:"Select and Brief Pilot Users",pri:"CRITICAL",st:"not-started",what:"Select 20-50 technically capable pilot users who can recognize and report anomalies: IT staff, power users, compliance team, security engineers. Brief every pilot user before license activation  -  not after.",impact:"The right pilot users surface issues early. Unbriefed pilot users are a security and compliance risk from day one.",how:"Selection criteria: understands GCC High data handling, Exchange Online primary mailbox confirmed, already in License Group. Briefing session (30 minutes before license activation): (1) Copilot uses Microsoft Graph within your permission boundary, (2) interactions are stored and subject to retention and eDiscovery, (3) web grounding is OFF, (4) do not enter sensitive content without policy authorization, (5) how to report unexpected behavior.",gcch:"Pilot users must understand the Work vs Web mode distinction and GCC High boundary implications."},{id:"pp-4",title:"Security Officer Notification  -  Level 1 Pilot",pri:"CRITICAL",st:"not-started",what:"Formally notify the security officer before any Copilot licenses are activated. Prepare a briefing package covering the data flow, security controls in place, planned pilot scope, open risk items, and confirmed feedback controls (restricted feedback  -  no verbatim prompt/response data  -  became the default for GCC High on March 31, 2026).",impact:"GCC High environments require security team awareness before new AI tools are activated. This is a process gate, not optional.",how:"Prepare briefing package: data flow diagram, controls summary, pilot scope documentation, open risk register. Include confirmation that restricted feedback is active: admin.microsoft365.us \u2192 Settings \u2192 Org settings \u2192 Microsoft feedback \u2192 confirm restricted feedback setting. Brief the security officer \u2192 document date, attendees, and acknowledgment received.",gcch:"Level 1 requires awareness and notification at minimum. Level 2 requires formal written sign-off  -  begin that conversation at the Level 1 briefing."}]},{id:"level1",label:"Level 1 Pilot",sub:"Restricted  -  20 to 50 Users",bg:"#0F3460",acc:"#38BDF8",items:[{id:"l1-1",title:"Assign Licenses  -  Pilot Group Only",pri:"CRITICAL",st:"not-started",what:"Assign the M365 Copilot add-on license to selected pilot users ONLY. License assignment activates full Microsoft Graph grounding  -  this is the moment Copilot gains access to tenant data.",impact:"Assigning licenses broadly before readiness is confirmed is a security risk. Every licensed user's email, files, Teams conversations, and SharePoint content becomes accessible to Copilot.",how:"Admin Center \u2192 Users \u2192 Active Users \u2192 select pilot users individually \u2192 Licenses \u2192 add M365 Copilot add-on. Confirm M365 G3 or G5 Government base license is present for each user before adding the add-on.",gcch:"Confirm base license is Government SKU. Do not assign to users not in the authorized pilot group."},{id:"l1-2",title:"Restricted Pilot Launch",pri:"CRITICAL",st:"not-started",what:"Activate the Level 1 pilot. Pre-launch checklist before communicating to pilot users: licenses assigned, Restricted SharePoint Search enabled with allowed list, web grounding documented OFF, Conditional Access verified, pilot users briefed, security officer notified, audit logging confirmed. Work Mode only  -  no agents.",impact:"This is the discovery phase. The goal is to surface issues before broader deployment while the blast radius is limited to 20-50 users.",how:"Complete checklist \u2192 communicate go-live to pilot users \u2192 begin daily audit log monitoring. Teams Meeting Copilot and Chat/Channel Copilot are NOT available in GCC High  -  do not include in pilot communications.",gcch:"Work Mode ONLY. No agent enablement. Daily audit monitoring from day one."},{id:"l1-3",title:"Permission Boundary, File Security, and Storage Tests",pri:"CRITICAL",st:"not-started",what:"Three security validation tests to run in the same session: (1) Ask Copilot for content from a site NOT on the Restricted SharePoint Search allowed list  -  verify no results are returned. Ask about an allowed site  -  verify results are returned. Document both. (2) From an unmanaged or non-compliant device, generate a file via Copilot and attempt to download it  -  document whether Conditional Access controls are honored (known GCC High Sev1 concern). (3) Generate files via Copilot across key surfaces and verify the user-facing link path matches actual storage and eDiscovery paths.",impact:"Test (1) is the primary security validation. Test (2) must be documented before Level 2  -  unmanaged device bypass has been raised as a Sev1 concern in GCC High. Test (3) validates the compliance chain for Copilot-generated content.",how:"(1) RSS boundary test: use a pilot licensed account, ask about restricted site content, document result. (2) Unmanaged device test: use a non-enrolled device, generate a Copilot file, attempt download, document result and identify compensating controls. (3) Storage validation: generate files, record URLs, verify storage path via compliance tools.",gcch:"Document all three tests with results before proceeding to Level 2. The unmanaged device test result must be on file."},{id:"l1-4",title:"Audit Log Monitoring and Conditional Access Validation",pri:"CRITICAL",st:"not-started",what:"Two monitoring tasks during the pilot: (1) Check Purview audit logs daily for CopilotInteraction events  -  verify they match expected pilot activity, investigate gaps immediately, export weekly for the security officer. (2) Review Entra sign-in logs to confirm Conditional Access policies are correctly evaluating for Copilot sessions  -  test from a non-compliant device to confirm block behavior.",impact:"Real-time view of what Copilot is doing in the tenant. The sign-in log review confirms Copilot is not bypassing Conditional Access controls.",how:"(1) compliance.microsoft.us \u2192 Audit \u2192 Interacted with Copilot \u2192 last 24 hours \u2192 verify events match pilot user activity. (2) entra.microsoft.us \u2192 Sign-in logs \u2192 filter for Copilot application \u2192 verify CA policy evaluated \u2192 test block from non-compliant device.",gcch:"Purview portal: compliance.microsoft.us. Entra portal: entra.microsoft.us. Export audit results weekly for security officer review."},{id:"l1-7",title:"Level 1 Exit Criteria Review  -  Gate to Level 2",pri:"CRITICAL",st:"not-started",what:"Formal review of Level 1 outcomes before any expansion. All three permission boundary tests must pass. Document any open issues. Brief the security officer with findings. Receive written acknowledgment before scheduling Level 2.",impact:"This is the gate. Proceeding to Level 2 without the security officer's acknowledgment creates authorization risk.",how:"Prepare findings summary: test results, any anomalies observed, open risk items, proposed compensating controls for anything not passing. Brief security officer \u2192 document acknowledgment \u2192 schedule Level 2 conversation.",gcch:"Written security officer acknowledgment is required before Level 2 expansion in GCC High. Begin the Level 2 conversation (broader scope, more users, ISSO formal sign-off) at the Level 1 debrief."}]},{id:"ops",label:"Full Operations",sub:"Ongoing Governance",bg:"#1F2937",acc:"#9CA3AF",items:[{id:"op-1",title:"Monthly Governance Audits  -  SharePoint Reports and Label Coverage",pri:"ONGOING",st:"not-started",what:"Monthly cadence on the 1st of each month: (1) Run Sharing Links Activity and Everyone Except External Users Activity reports in Data Access Governance  -  action all flags within 48 hours. (2) Track sensitivity label coverage using Purview Content Explorer  -  target 80%+ label coverage on business-critical sites and report progress to the security officer quarterly.",impact:"Without ongoing monitoring, remediation gains erode continuously as users create new sharing and new content arrives unlabeled.",how:"Calendar reminder \u2192 1st of month \u2192 run both Data Access Governance activity reports \u2192 action any new Everyone Except External Users flags within 48 hours. Quarterly: Purview Content Explorer \u2192 filter by label status \u2192 calculate coverage percentage \u2192 include in security officer report.",gcch:"Consider automating via the Governance Agent once Phase 11 is active."},{id:"op-3",title:"Service Description and Policy Reviews",pri:"ONGOING",st:"not-started",what:"Two ongoing monitoring responsibilities: (1) Weekly review of Microsoft 365 Message Center, Microsoft Public Sector Blog, and Service Description footnotes for GCC High feature changes  -  Copilot features arrive in GCC High without advance notice. (2) Annual review of all AI-related policies: AI usage policy, Copilot retention policy, DLP Copilot location, feedback controls, and agent governance policy. Update and re-communicate any changes.",impact:"Features arrive in GCC High without warning. Missing an availability change means users find capabilities before the security team has evaluated them. Annual policy reviews ensure governance keeps pace with product evolution.",how:"Weekly: 15-minute scan of Message Center + Public Sector Blog. When a new feature is announced: validate in GCC High tenant before communicating. Annual: calendar reminder \u2192 review each policy document \u2192 assess whether product changes require updates \u2192 brief security officer on changes.",gcch:"Monitor Work/Web grounding model evolution closely  -  any change to how web grounding is controlled must trigger a review of authorization assumptions and ISSO-approved boundary assertions before updating documentation."},{id:"op-5",title:"Governance Agent  -  Automate the Ongoing Cycle",pri:"ONGOING",st:"not-started",what:"Build and deploy a Governance Agent to automate the ongoing governance cycle: continuous oversharing monitoring, policy drift detection, automatic authorization evidence collection, alerts on GCC High feature changes, and on-demand governance status briefs.",impact:"Replaces the manual monthly and quarterly governance cadence with continuous automated monitoring. Without this, the governance workload is a permanent manual overhead.",how:"Build using Copilot Studio + M365 Agents Toolkit + Power Automate + Microsoft Graph APIs. Permissions required: Sites.Read.All, Reports.Read.All, AuditLog.Read.All, Policy.Read.All. All calls to graph.microsoft.us. See agents deck for full architecture and 12-week build plan.",gcch:"Copilot Studio and M365 Agents Toolkit confirmed available in GCC High as of April 2026. All agent calls
