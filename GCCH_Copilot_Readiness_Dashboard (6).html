 enter sensitive or CUI content unless explicitly authorized by policy.",access:"Any M365 G3/G5 user with base license.",shield:"Enterprise shield = authenticated work identity only. Does not confirm GCCH compliance scope.",status:"Control via Integrated Apps scoping and CA policy. Web grounding is OFF by default in GCCH.",items:["No email, file, SharePoint, or Teams access","Responses based on prompt input + model knowledge","Web grounding OFF = stays within GCCH when used responsibly","Audit logging behavior for unlicensed Copilot Chat should be validated in the tenant; do not assume CopilotInteraction events are generated","Risk is what users type  -  CUI must never be entered without explicit policy authorization"]},{id:"cv2",label:"Unlicensed Copilot Chat",sub:"Web Grounding ON",filterPhases:["pre","access","unlicensed","adminconfig"],rec:!1,badge:"GCCH BOUNDARY RISK  -  WEB GROUNDING ENABLED",badgeColor:"#991B1B",badgeBg:"#FEE2E2",color:"#7C2D12",grounding:"No tenant grounding. Responses based on prompt input + public web content.",boundary:"When web grounding is enabled, Copilot generates and sends a short derived search query to Bing, which is outside the GCC High boundary. Microsoft documentation confirms that full prompts, tenant documents, and Graph data are not sent to Bing  -  only a minimal query derived from the prompt. In GCC High, Bing is a commercial endpoint outside the sovereign boundary, so this represents a boundary interaction requiring explicit security approval.",compliance:"Data processed outside GCCH boundary. Not appropriate for sensitive or CUI-adjacent workloads without explicit security team approval.",useCase:"Not recommended. If enabled, restrict strictly to non-sensitive use cases with documented risk acceptance.",access:"Any M365 G3/G5 user with base license.",shield:"Enterprise shield = authenticated work identity only. Does NOT mean data stays in GCCH when web grounding is ON.",status:"Web grounding is OFF by default in GCCH. Requires deliberate admin enablement via Cloud Policy.",items:["No tenant data access","Web queries route to commercial Bing  -  outside GCCH boundary","Requires explicit security team approval and documented risk acceptance","Do not enable without ISSO sign-off","Cannot scope per individual user  -  validate granularity in tenant"]},{id:"cv3",label:"Licensed M365 Copilot",sub:"Web Grounding OFF (Recommended)",rec:!0,badge:"RECOMMENDED DEPLOYMENT POSTURE",badgeColor:"#1E40AF",badgeBg:"#DBEAFE",color:"#1D4ED8",filterPhases:["pre","access","unlicensed","sam","purview","monitoring","entra","adminconfig","pilotprep","level1","ops"],grounding:"Full Microsoft Graph grounding across email, files, Teams messages, SharePoint content, and calendar  -  everything the user already has permission to see.",boundary:"Designed to remain within the GCCH boundary when used in Work Mode with web grounding OFF. Behavior should be validated in the tenant.",compliance:"CopilotInteraction audit events captured. Governed by Purview retention for Copilot and AI apps location. Accessible via eDiscovery. Interactions subject to DLP, sensitivity labels, and information barriers.",useCase:"The full Microsoft 365 Copilot experience  -  productivity across every M365 app and surface your team already uses daily.",access:"M365 G3/G5 Government base license + M365 Copilot add-on license. Exchange Online primary mailbox required.",shield:"Enterprise shield = authenticated work identity. In Work Mode with web grounding OFF, GCCH boundary maintained  -  validate in tenant.",status:"Target state for pilot and full production deployment.",valueProps:[{icon:"\u2709",label:"Summarize email threads",desc:"Instantly catch up on long email conversations. Ask Copilot to summarize a thread, identify action items, or draft a reply based on context."},{icon:"\u{1F4C4}",label:"Draft documents and emails",desc:"Describe what you need  -  Copilot drafts it. First drafts of emails, memos, meeting follow-ups, and reports in seconds."},{icon:"\u{1F50D}",label:"Find anything across M365",desc:"Ask a natural language question  -  Copilot searches across your email, Teams, SharePoint, and files simultaneously to surface the answer."},{icon:"\u{1F4DD}",label:"Intelligent Recap (post-meeting notes)",desc:"After a meeting, Copilot generates a summary with key discussion points, decisions, and action items  -  attributed to each speaker. Validate availability in your GCCH tenant."},{icon:"\u{1F4CA}",label:"Excel data analysis",desc:"Describe the analysis you want in plain language. Copilot creates formulas, charts, and pivot tables  -  and explains the findings in plain text."},{icon:"\u{1F4D1}",label:"PowerPoint drafting",desc:"Describe a presentation topic and Copilot creates a structured slide outline with content. Note: translation, speaker notes generation, and presentation summaries not yet available in GCC High."},{icon:"\u{1F4AC}",label:"Teams context and follow-up",desc:"Summarize what you missed while away. Draft follow-up messages based on conversation context. Note: in-meeting Copilot and chat/channel Copilot not yet available in GCC High."},{icon:"\u{1F916}",label:"Custom agents (Phase 3)",desc:"After pilot stabilizes: build custom agents grounded in your SharePoint knowledge bases, automating specific workflows  -  help desk, document Q&A, process guidance. Pro-code path in GCC High."}],items:["Full Graph grounding  -  accesses email, files, Teams, SharePoint within user permission boundary","Designed to remain within GCCH in Work Mode with web grounding OFF  -  validate in tenant","CopilotInteraction events auditable in Purview  -  verify CopilotInteraction audit events are being generated","Governed by Purview retention when Copilot and AI apps location is configured  -  MUST be explicitly set","Requires: Exchange Online primary mailbox, M365 Apps on Current or Monthly Enterprise Channel, WebSocket connectivity","NOT yet in GCC High: Teams Meeting Copilot (in-meeting pane), Teams Chat/Channel Copilot, PowerPoint translation/speaker notes, Mac desktop app","Intelligent Recap, DSPM for AI, and other features: validate current availability in your GCCH tenant before communicating"]},{id:"cv4",label:"Licensed M365 Copilot",sub:"Web Grounding ON",filterPhases:["pre","access","unlicensed","sam","purview","monitoring","entra","adminconfig","pilotprep","level1","ops"],rec:!1,badge:"GCCH BOUNDARY RISK  -  WEB GROUNDING ENABLED",badgeColor:"#92400E",badgeBg:"#FEF3C7",color:"#B45309",grounding:"Full Microsoft Graph grounding PLUS public web content via Bing search.",boundary:"When web grounding is enabled, both licensed and unlicensed Copilot generate and send a short derived search query to Bing  -  the same class of boundary interaction. Microsoft documentation confirms that tenant documents, emails, and Graph data are NOT sent to Bing. Licensed Copilot operates under enterprise contractual protections (DPA, no training on data), but the boundary consideration is the same class as unlicensed. Neither is more risky than the other specifically because of tenant data being sent out  -  that does not happen.",compliance:"Licensed tier adds contractual protections  -  but data still routes through commercial Bing infrastructure. Validate implications with ISSO before enabling.",useCase:"Improved response quality for non-sensitive topics. Not appropriate for sensitive workloads without explicit approval.",access:"M365 G3/G5 + M365 Copilot add-on.",shield:"Enterprise shield does not mean web queries stay in GCCH. They do not.",status:"Off by default in GCCH. Requires admin enablement via Cloud Policy. Treat as a risk decision, not a feature upgrade.",items:["Same class of boundary interaction as unlicensed web ON  -  both send only a short derived query to Bing, NOT full documents or tenant data","Microsoft documentation confirms: tenant documents, emails, and Graph data are not sent to Bing  -  only a minimal derived query","Licensed tier adds contractual protections (DPA, no training on your data)  -  stronger than unlicensed","Requires written security team approval and documented risk acceptance before enabling","Real security difference between licensed and unlicensed is when web grounding is OFF  -  not when it is ON","Cannot be scoped per user  -  validate granularity in tenant before communicating as an option"]},{id:"cv5",label:"Copilot Studio",sub:"GCC High  -  Separate Product",filterPhases:["pre","access","adminconfig","ops"],rec:null,badge:"SEPARATE LICENSING  -  VALIDATE GCCH AVAILABILITY",badgeColor:"#4C1D95",badgeBg:"#EDE9FE",color:"#6D28D9",grounding:"Custom agents grounded in data sources you configure: SharePoint, Dataverse, custom APIs. Respects user permissions via Microsoft Graph.",boundary:"Stays within GCCH when using GCCH-approved data sources. External connectors must be individually evaluated.",compliance:"Power Platform DLP governs connector-level behavior. Purview DLP governs content. Both apply. Audit logging via Purview. Separate Power Platform tenant/environment considerations.",useCase:"Custom AI agents for specific workflows: help desk, document Q&A, process automation, knowledge base search.",access:"Separate Copilot Studio licensing. Copilot Studio for US Government available in GCC High. Agent Builder and low-code studio NOT yet confirmed in GCCH  -  only declarative agents via M365 Agents Toolkit (pro-code) currently supported.",shield:"Authentication via Entra ID. Agent permissions are user-delegated  -  cannot exceed user's own access.",status:"Evaluate for Phase 3 (post-pilot). Agent governance policy must be published before enablement.",items:["Separate product from M365 Copilot  -  separate licensing and admin surface","Only declarative agents via M365 Agents Toolkit (pro-code) confirmed in GCCH","Agent Builder and low-code authoring not yet confirmed for GCCH","Power Platform DLP controls which connectors agents can use","Purview DLP controls what content agents can surface","External connectors not enabled by default in GCCH  -  require explicit admin enablement","Each agent is a change-managed event: define data sources, permissions, approval workflow"]}],wv=[{id:"faq-1",category:"Access",q:"Why can't a user see Copilot in Teams?",a:"Work through these in order: (1) Global Teams App Permission Policy blocks Copilot for all users  -  correct by design. The user must also have the M365_Copilot_Allowed permission policy assigned. (2) Integrated Apps must scope Copilot to the user's group. (3) CA policy must allow the user. (4) Policy changes take time to propagate  -  retest after a significant wait before concluding something is broken.",verify:"Teams Admin Center (admin.teams.microsoft.us) \u2192 Users \u2192 select user \u2192 Policies tab \u2192 confirm M365_Copilot_Allowed is assigned. Also check Integrated Apps scoping in admin.microsoft365.us.",gcch:"All three controls must be in place simultaneously. A gap in any one allows or blocks access regardless of the others."},{id:"faq-2",category:"Access",q:"A user shouldn't have Copilot access but they can see it  -  why?",a:"Most likely: Copilot Chat (unlicensed surface) and licensed M365 Copilot are separate service surfaces with separate configuration paths. If only one was scoped in Integrated Apps, the other may remain accessible. Validate both experiences independently.",verify:"admin.microsoft365.us \u2192 Settings \u2192 Integrated Apps \u2192 verify BOTH Microsoft 365 Copilot AND Microsoft 365 Copilot Chat entries are scoped to authorized groups. Then test the unauthorized user's access from Teams and from the M365 portal.",gcch:"Validate both surfaces independently. The separation exists in both product behavior and the compliance boundary."},{id:"faq-3",category:"Licensing",q:"What is the real difference between unlicensed Copilot Chat and licensed M365 Copilot?",a:`The key difference is grounding: unlicensed Copilot Chat does not access tenant data via Microsoft Graph, while licensed M365 Copilot uses Graph to retrieve content the user already has access to.

Unlicensed Copilot Chat: no tenant Graph grounding. Responses are based on prompt input and model knowledge only.

Licensed M365 Copilot (Work Mode, web grounding OFF): uses Microsoft Graph to access content the user already has permission to see. Stays within GCCH in this configuration.

When web grounding is ON, Copilot generates and sends a short derived search query to Bing  -  outside the GCC High sovereignty boundary. Microsoft documentation explicitly confirms that full prompts, tenant documents, and Graph data are NOT sent to Bing. Only a minimal derived query leaves the boundary. In GCC High, Bing is a commercial endpoint, so this boundary interaction requires explicit security team approval and formal risk acceptance documentation regardless of the minimal nature of what is transmitted.`,verify:"admin.microsoft365.us \u2192 Settings \u2192 Copilot settings \u2192 locate web grounding / web search control \u2192 confirm OFF \u2192 screenshot with admin account and date \u2192 file to authorization evidence folder.",gcch:"Verify this setting for both unlicensed Copilot Chat and licensed M365 Copilot. Do not enable without written security team approval and formal risk acceptance documentation. ZQL context: Zero Query Logging (ZQL), if active in your environment, ensures Bing does not retain the derived query after processing - covering query text, identifiers, and prompt signals. ZQL is a retention control only; it does not eliminate the boundary crossing or the approval requirement."},{id:"faq-7",category:"Governance",q:"Can we enable web grounding for just one user or group?",a:"Validate in your tenant before asserting. The admin control is cloud-policy-based and may support per-group targeting  -  confirm whether your GCCH tenant supports scoped enablement before communicating it as an option.",verify:"admin.microsoft365.us \u2192 Copilot settings \u2192 check whether web grounding Cloud Policy can be scoped to a group. Document finding before communicating to ISSO.",gcch:"Do not assert per-user/group scoping without tenant verification. Treat it as tenant-wide unless confirmed otherwise."},{id:"faq-8",category:"Data Governance",q:"Our data is a mess  -  nothing labeled, 249 oversharing sites. Can we still deploy Copilot safely?",a:`Yes  -  with layered controls. Tenant grounding cannot be disabled while keeping licensed Copilot active. What you control is the aperture.

RSS (Restricted SharePoint Search): tenant-wide. Limits which SP sites Copilot and Search can access. Sites not on your allowed list are invisible to Copilot. PowerShell only. Temporary  -  disable when remediation complete.

RCA/RSA (Restricted Access Control): per-site hard boundary. Limits access to a named Entra security group. Changes actual permissions. Permanent governance.

Recommended: enable RSS with narrow initial allowed list. Apply RCD to highest-risk sites. Apply RCA to most sensitive sites. Expand RSS as sites clear readiness criteria. Disable RSS when governance posture is sound.`,verify:"Validate each control in tenant before citing in ATO documentation. RSS: Get-SPOTenantRestrictedSearchAllowedList. RCD: SharePoint Admin \u2192 Active sites \u2192 site \u2192 Settings. RCA: same path, Restricted access control.",gcch:"All three controls available in GCCH. Validate behavior per control  -  do not assume commercial parity."},{id:"faq-9",category:"Data Governance",q:"What SharePoint sites can Copilot currently see?",a:`If RSS is enabled, Copilot can only see sites on the allowed list. If disabled, Copilot reaches any SharePoint content the user has access to  -  including all 249 oversharing sites.

For RSS specifically: validate in tenant whether agents respect RSS restrictions. The permission enforcement model is well-documented but RSS interaction with agents should be explicitly tested before publishing agents to users.`,verify:"Create a test agent, enable RSS, ask the agent to retrieve content from a site not on the RSS allowed list. Document observed behavior before publishing any agents.",gcch:"Agent Builder rolling out in GCCH as of April 2026. No group-level controls on who can create agents exist today. Publish an agent governance policy before users create agents independently."},{id:"faq-18",category:"Compliance",q:"What is Power Platform DLP and how is it different from Purview DLP?",a:`These are two completely separate DLP systems that protect different things. You need both.

PURVIEW DLP  -  Content Protection:
Purview DLP inspects actual data content (files, emails, Copilot prompts/responses). It blocks or audits based on what the data contains  -  sensitivity labels, sensitive information types (SITs), or other content conditions. It protects data in SharePoint, OneDrive, Exchange, Teams, and Microsoft 365 Copilot. This is your data-level control.

POWER PLATFORM DLP  -  Connector Governance:
Power Platform DLP operates at the connector level in Power Platform Admin Center. It governs which connectors (SharePoint, HTTP, custom APIs, etc.) Power Automate flows and Power Apps can use together. It does NOT inspect data content  -  it controls which services can be combined. Connectors are sorted into Business (can be combined) and Non-Business/Blocked buckets.

For Copilot Studio agents built with Power Automate: BOTH apply simultaneously. Power Platform DLP governs what external services the agent's flow can connect to. Purview DLP governs what content the agent can surface to users. A gap in either one creates a compliance exposure.`,verify:"Power Platform DLP: admin.powerplatform.microsoft.com (or equivalent GCCH URL) \u2192 Policies \u2192 Data policies. Purview DLP: compliance.microsoft.us \u2192 Data Loss Prevention \u2192 Policies.",gcch:"Power Platform DLP uses the Power Platform Admin Center, separate from M365 Admin Center. For GCCH, confirm the correct admin URL for your Power Platform environment."},{id:"faq-19",category:"Availability",q:"What features are NOT available in GCC High right now?",a:`Confirmed NOT available (as of May 2026):

Key behavior: content placed in Archive is excluded from Microsoft 365 Copilot processing and grounding. Copilot cannot surface archived content. The content is still preserved for eDiscovery and recordkeeping  -  it is just invisible to Copilot.

Use cases:
