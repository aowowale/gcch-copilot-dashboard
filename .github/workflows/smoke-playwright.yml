name: Smoke Tests (Playwright)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@49933ea5288caeca8642d1e84afbd3f7d6820020

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Start preview
        run: npm run preview -- --host 127.0.0.1 --port 4173 &

      - name: Wait for preview
        run: npx --yes wait-on@8.0.3 http://127.0.0.1:4173

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
