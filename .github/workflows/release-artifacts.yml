name: Release Build Artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root-combined
            project: .
            artifact: root-combined-dist
          - name: standalone-briefing
            project: copilot-briefing
            artifact: standalone-briefing-dist
          - name: standalone-onboarding-hub
            project: copilot-onboarding-hub
            artifact: standalone-onboarding-hub-dist

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/dist
          if-no-files-found: error
