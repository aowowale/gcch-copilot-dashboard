name: Deploy Static Web Apps (OIDC)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/deploy-swa-oidc.yml'
      - 'copilot-briefing/**'
      - 'copilot-onboarding-hub/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-swa-oidc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: briefing
            project: copilot-briefing
            resourceGroup: rg-gcch-dashboard
            staticWebAppName: gcchdashswabdito1pz
          - surface: onboarding-hub
            project: copilot-onboarding-hub
            resourceGroup: rg-gcch-dashboard
            staticWebAppName: gcchdashswareusable1pz

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - name: Checkout
        uses: actions/checkout@49933ea5288caeca8642d1e84afbd3f7d6820020

      - name: Setup Node
        uses: actions/setup-node@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Azure login (OIDC)
        uses: Azure/login@91d778e7ba32fe5946d69a20848327c9718cdbc2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to SWA
        shell: bash
        run: |
          CLOUD_NAME="${{ vars.AZURE_CLOUD }}"
          if [ -z "$CLOUD_NAME" ]; then CLOUD_NAME="AzureCloud"; fi
          az cloud set --name "$CLOUD_NAME"

          DEPLOYMENT_TOKEN=$(az staticwebapp secrets list \
            -n "${{ matrix.staticWebAppName }}" \
            -g "${{ matrix.resourceGroup }}" \
            --query properties.apiKey -o tsv)

          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "Deployment token lookup failed for ${{ matrix.staticWebAppName }}" >&2
            exit 1
          fi

          npx --yes "@azure/static-web-apps-cli@2.0.10" deploy ./dist \
            --deployment-token "$DEPLOYMENT_TOKEN" \
            --env production
